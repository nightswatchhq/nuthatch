# cargo-deny - dependency vulnerability + licence gate (0.5.x hardening).
# Runs in CI on every PR. Licence hygiene is a CLAUDE.md non-negotiable: the core is `MIT OR
# Apache-2.0`, so every dependency must offer a permissive (or weak-copyleft-via-OR) licence arm.
# Note the constraint got *stricter* with the relicence, not looser: under AGPL we could at least have
# consumed GPL code in principle. We cannot now, so a GPL/LGPL-only dependency must fail the build.

[advisories]
version = 2
# Fail the build on a yanked crate or any RUSTSEC advisory. Add an `ignore` entry only with a written
# justification - never to make a red build green quietly.
yanked = "deny"
# Flag unmaintained crates only when a workspace member depends on one directly (actionable); deep
# transitive build-macro crates going unmaintained (paste, proc-macro-error*, derivative) is noise, not
# a release gate.
unmaintained = "workspace"
ignore = [
  # quick-xml (transitive: dbsp → feldera-storage → object_store). object_store uses it to parse XML
  # from cloud object stores; nuthatch never configures one and never feeds it untrusted XML (it stores
  # DBSP state as local Parquet), so neither DoS is reachable. dbsp pins the 0.38 line, so we can't move
  # it without bumping dbsp. Re-check on the next dbsp bump.
  "RUSTSEC-2026-0194", # quick-xml: quadratic time on duplicate start-tag attributes
  "RUSTSEC-2026-0195", # quick-xml: unbounded namespace-declaration allocation
  # RUSTSEC-2026-0188 (wasmtime-wasi FilePerms bypass) is FIXED, not ignored: wasmtime 44 → 46 clears it
  # with no code change (the component-model API was stable across the bump). Ignore entry removed.
  #
  # rkyv 0.7.46 (transitive: dbsp → {rkyv, feldera-storage, ordered-float}). The advisory is an
  # out-of-bounds read when *validating an untrusted archive*: `rkyv::access` / `from_bytes` could be
  # handed a forged slice length. Reachability here is the question, and the answer is no:
  #   - nuthatch never calls rkyv (`grep -rn rkyv src/` is empty); it arrives only under DBSP, which
  #     uses it for its own batch/spine serialisation.
  #   - Every rkyv archive in play is written by this process into its own nest directory. Forging one
  #     means already having write access to the nest dir, at which point the archive is the least of
  #     it - `nuthatch.toml` and the ABIs are right there.
  #   - The genuinely untrusted inputs are RPC responses (JSON), nest bundles (config/ABIs/views plus a
  #     hash-checked manifest) and `/sql` text. None of them is an rkyv archive, and a bundle's data
  #     files are Parquet.
  # Not fixable by upgrading: the fix is rkyv >= 0.8.17, the 0.7 series is unsupported upstream, and
  # **dbsp still requires `rkyv ^0.7.45` as of 0.327.0** (checked 2026-08-04), so even the newest dbsp
  # does not clear it. Tracked upstream; re-check on the next dbsp bump, same as the quick-xml pair.
  "RUSTSEC-2026-0235", # rkyv: shared-pointer validation ignored pointer metadata
  # h2 0.3.x (transitive: reqwest → hyper 0.14 → h2 0.3). The 0.4.x entry was updated to
  # 0.4.16 (the patched release). The 0.3.x series has no patched version and is held in the
  # tree by reqwest's dependency on hyper 0.14, which in turn is required by several other deps;
  # updating to hyper 1.x is a larger cross-crate migration. The flaw (unbounded empty DATA
  # frames if the stream is not actively drained) requires a peer that deliberately spams empty
  # frames; nuthatch only opens outbound RPC connections to trusted endpoints the operator
  # configured, so the attack surface is controlled. Low severity per the advisory; re-check on
  # the next reqwest/hyper bump.
  "RUSTSEC-2026-0258", # h2: unbounded empty DATA frames
]

[licenses]
version = 2
confidence-threshold = 0.9
# Every permissive licence actually present in the tree. Crates that offer an OR with a copyleft arm
# (ittapi = `GPL-2.0-only OR BSD-3-Clause`, r-efi = `MIT OR Apache-2.0 OR LGPL-2.1-or-later`) resolve to
# their permissive arm here. We deliberately do NOT list GPL-2.0-only or LGPL, so a future GPL/LGPL-*only*
# dependency fails the build - which is the point.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-1-Clause",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "0BSD",
  "ISC",
  "Zlib",
  "BSL-1.0",             # Boost Software Licence (permissive) - NOT the Business Source Licence.
  "Unicode-3.0",
  "Unlicense",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "bzip2-1.0.6",
]

[bans]
# Duplicate versions are common and fine in a Rust tree - warn, don't fail.
multiple-versions = "warn"
# CLAUDE.md non-negotiable 5: never vendor these. Belt-and-braces (they're not in the tree and never
# should be) - a Business-Source-Licence engine or a HyperSync client sneaking in fails the build.
deny = [
  { name = "materialize" },
  { name = "hypersync-client" },
  { name = "hypersync-net-types" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
