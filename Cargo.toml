[package]
name = "nuthatch"
version = "0.7.0"
edition = "2021"
rust-version = "1.85"
description = "Be your own indexer. One Rust binary, one command, live in under two minutes."
license = "MIT OR Apache-2.0"
repository = "https://github.com/nuthatch-indexer/nuthatch"
homepage = "https://www.nuthatch-indexer.com"
readme = "README.md"
keywords = ["blockchain", "indexer", "ethereum", "self-hosted", "mcp"]
categories = ["command-line-utilities", "database", "cryptography::cryptocurrencies"]
# Keep the published crate lean: the 1.2 MB example WASM component and its guest source aren't
# needed to build the host (only a skipped test loads it), and the scratch/docs aren't either.
exclude = ["/components", "/scratchpad"]

[[bin]]
name = "nuthatch"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
async-trait = "0.1"
futures = "0.3"
alloy-json-abi = "1.6"
alloy-dyn-abi = "1.6"
alloy-primitives = "1.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
redb = "2"
arrow = { version = "58", features = ["ipc"] }
parquet = { version = "58", default-features = false, features = ["arrow", "snap"] }
duckdb = { version = "1", features = ["bundled"] }
dbsp = "0.320"
wasmtime = { version = "46", features = ["component-model"] }
wasmtime-wasi = "46"
sha2 = "0.10"
arc-swap = "1"
ed25519-dalek = "2"
getrandom = "0.3"
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4"
tar = "0.4"
tempfile = "3"
rustyline = "18.0.1"
starlark = "0.14"
# RFC-0019 slice 2: the object-store (S3) registry backend. `object_store` core is already in the tree
# transitively (via dbsp/feldera-storage), so this optional dep only adds the `aws` S3/HTTP *transport*
# when the feature is on - the FsStore covers the self-hosted case, S3 is the fleet path. Pinned to 0.12
# to match dbsp's version so the subtree dedupes (a 0.11 pin duplicated the whole object_store tree).
# Apache-2.0 (arrow-rs family). `aws` covers S3/MinIO/R2 via env config (AWS_ENDPOINT etc).
object_store = { version = "0.12", optional = true, features = ["aws"] }
url = { version = "2", optional = true }

[features]
# The S3 registry ships **on**. It was off by default until 2026-07-28, which meant the released
# binary and the container image answered `--registry s3://…` with "needs a build with
# `--features object-store`" - so for anyone who did not build from source, the object-store backend
# the docs advertise simply did not exist. Measured cost of enabling it: **two** lines of dependency
# tree, because `object_store` is already compiled (via dbsp/feldera-storage) and `url` is already
# present; the feature only adds the `aws` transport on top of a crate we were building anyway.
default = ["object-store"]
# ExEx tip-ingestion source (colocated reth). Stubbed today - see docs/exex-design.md - so the
# default build never pulls the (enormous) reth dependency.
exex = []
# Object-store (S3-compatible) nest-registry backend (RFC-0019 slice 2). Kept as a named feature so a
# build that genuinely wants it gone can `--no-default-features`.
object-store = ["dep:object_store", "dep:url"]

[dev-dependencies]
proptest = "1"

[profile.release]
lto = "thin"
strip = true
