# deploy/swap-nest-dir.sh config: data-services-nest (8114) onto its re-index staged as
# data-services-nest-fresh (8115), nuthatch#1916. The re-index is the same nest definition (the same
# commit of nightswatchhq/data-services-nest, so the same NID and dataset) built without the arb1
# fallback, which answered six sealed rows' blockTimestamp as 0x0 under 3.12.1.
PROD_UNIT=data-services-nest
STAGED_UNIT=data-services-nest-fresh
PROD_DIR=/opt/nuthatch/data-services-nest
STAGED_DIR=/opt/nuthatch/data-services-nest-fresh
PROD_PORT=8114
STAGED_PORT=8115
OLD_SUFFIX=pre-reindex
SMOKE=~/Projects/kittiwake/nuthatch-gate/smoke/data-services-nest.sql
# Rows with no timestamp across every table that has any: 6 on the old index, 0 on the re-index.
INVARIANT="SELECT count(*) AS zero_timestamps FROM (SELECT block_timestamp FROM dispatch__provider_registered UNION ALL SELECT block_timestamp FROM dispatch__provider_deregistered UNION ALL SELECT block_timestamp FROM seahorn__provider_registered UNION ALL SELECT block_timestamp FROM seahorn__provider_deregistered UNION ALL SELECT block_timestamp FROM sdsce__provider_registered UNION ALL SELECT block_timestamp FROM sdsce__provider_deregistered UNION ALL SELECT block_timestamp FROM mainline__provider_registered UNION ALL SELECT block_timestamp FROM mainline__provider_deregistered UNION ALL SELECT block_timestamp FROM nuthatch_data_service__provider_registered UNION ALL SELECT block_timestamp FROM nuthatch_data_service__provider_deregistered) WHERE block_timestamp = 0"
INVARIANT_WANT=0
