# Secrets are files under ./secrets (not committed; copy secrets.example/ and fill them in).
route:
  receiver: discord
  group_by: [alertname, unit]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # The dead-man signal is read, not sent: helsinki/deadman.sh asks this Alertmanager whether
    # Watchdog is still active and pages Discord when it is not. Nothing leaves the tailnet.
    - matchers: ['alertname = "Watchdog"']
      receiver: none

receivers:
  - name: discord
    discord_configs:
      - webhook_url_file: /etc/alertmanager/secrets/discord_webhook_url
        send_resolved: true
        title: '{{ if eq .Status "firing" }}FIRING{{ else }}RESOLVED{{ end }}: {{ .CommonLabels.alertname }}'
        message: '{{ range .Alerts }}{{ .Annotations.summary }}{{ "\n" }}{{ end }}'
  - name: none

inhibit_rules:
  # A unit that does not answer cannot answer /ready either.
  - source_matchers: ['alertname = "TargetDown"']
    target_matchers: ['alertname = "NestNotReady"']
    equal: [instance]
