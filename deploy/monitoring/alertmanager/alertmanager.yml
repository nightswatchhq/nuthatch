# Secrets are files under ./secrets (not committed; copy secrets.example/ and fill them in).
route:
  receiver: discord
  group_by: [alertname, unit]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # The dead-man signal: pinged every minute while the pipeline is alive. The heartbeat service
    # pages when the pings stop, which is the one failure Alertmanager cannot report itself.
    - matchers: ['alertname = "Watchdog"']
      receiver: heartbeat
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 1m

receivers:
  - name: discord
    discord_configs:
      - webhook_url_file: /etc/alertmanager/secrets/discord_webhook_url
        send_resolved: true
        title: '{{ if eq .Status "firing" }}FIRING{{ else }}RESOLVED{{ end }}: {{ .CommonLabels.alertname }}'
        message: '{{ range .Alerts }}{{ .Annotations.summary }}{{ "\n" }}{{ end }}'
  - name: heartbeat
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/heartbeat_url
        send_resolved: false

inhibit_rules:
  # A unit that does not answer cannot answer /ready either.
  - source_matchers: ['alertname = "TargetDown"']
    target_matchers: ['alertname = "NestNotReady"']
    equal: [instance]
