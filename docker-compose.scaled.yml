# Scaled mode (RFC-0022). **Not** the way to run nuthatch - the single binary is, and embedded mode
# needs none of this. This exists for the distributed self-hosted fleet an operator runs across
# machines, and for the parity suite that proves the Postgres hot store answers identically to redb.
#
# The full RFC-0022 stack: an external hot store, a **control plane** holding desired state, a
# **writer pool** whose members take cursor leases, and an **FE tier** that serves from the shared
# store and owns nothing. Every service here corresponds to something that exists and is tested.
#
#   docker compose -f docker-compose.scaled.yml up -d postgres     # just the store (for the tests)
#   NUTHATCH_TEST_PG=postgres://nuthatch:nuthatch@127.0.0.1:5433/nuthatch \
#     cargo test --features postgres-store --test pg_parity
#
#   docker compose -f docker-compose.scaled.yml --profile fleet up \
#     --scale writer=2 --scale fe=3        # control plane + a writer pool + an FE tier
#
# The fleet profile needs the **scaled** image - `ghcr.io/nuthatch-indexer/nuthatch:<version>-scaled`.
# The default published image is the embedded build and deliberately carries no database driver, so
# `worker` and `control` are not in it. Set `NUTHATCH_IMAGE` to pick a version.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nuthatch
      POSTGRES_PASSWORD: nuthatch
      POSTGRES_DB: nuthatch
      # `--locale-provider=icu` is deliberately NOT used, and the initdb locale is C. The hot store
      # keys on zero-padded strings whose *byte* order is chain order; a locale-aware default
      # collation would reorder them. The table DDL pins `COLLATE "C"` per column as well, so this is
      # belt and braces - but a database whose default disagrees with its columns is a trap for the
      # next person who adds a table and forgets.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    # 5433 on the host: a developer running the parity suite very likely has a local Postgres on
    # 5432, and silently connecting to *that* would create schemas in someone's real database.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - nuthatch-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nuthatch -d nuthatch"]
      interval: 3s
      timeout: 3s
      retries: 20

  # The control plane: what the fleet *should* run. Writes desired state; commands nobody.
  #
  # Bound to localhost on the host side because it decides what the whole fleet runs - reaching it
  # from elsewhere means a tunnel or a token, and the binary refuses to serve off-localhost without
  # `NUTHATCH_CONTROL_TOKEN` rather than merely warning about it.
  control:
    profiles: ["fleet"]
    image: ${NUTHATCH_IMAGE:-ghcr.io/nuthatch-indexer/nuthatch:0.8.0-scaled}
    depends_on:
      postgres: { condition: service_healthy }
    command: >-
      control --listen 0.0.0.0:8290
      --db postgres://nuthatch:nuthatch@postgres:5432/nuthatch
    environment:
      # Set this and the API will demand it. Left unset here because the published port is
      # 127.0.0.1-only; a real deployment sets it.
      NUTHATCH_CONTROL_TOKEN: ""
    ports:
      - "127.0.0.1:8290:8290"

  # The writer pool: owns cursors, ingests, seals.
  #
  # **This is now safely scalable** - `--scale writer=3` - which it was not before RFC-0022 slice 4.
  # Until the lease existed, "exactly one writer per chain" was enforced by *this file saying so*;
  # now a cursor is held by whichever worker holds its lease, and a stale holder's writes are refused
  # by the store rather than merely discouraged by a comment.
  #
  # Each replica gets its own worker id from the container hostname, which compose makes unique.
  # Two workers sharing an id would look like one worker to the registry and could both hold what
  # each believed was its own lease - so it is derived rather than configured.
  writer:
    profiles: ["fleet"]
    image: ${NUTHATCH_IMAGE:-ghcr.io/nuthatch-indexer/nuthatch:0.8.0-scaled}
    depends_on:
      postgres: { condition: service_healthy }
    command: >-
      dev --dir /nest --listen 0.0.0.0:8288 --no-admin
    volumes:
      - ./nest:/nest
    # No host port: with several replicas there is nothing sensible to publish, and a writer's HTTP
    # surface is for health and metrics rather than for serving reads - that is the FE tier's job.

  # Query-FE nodes: serve from the shared store, own no cursor, and are interchangeable. Scale this
  # one freely - `docker compose --profile fleet up --scale fe=5` - because nothing here writes.
  fe:
    profiles: ["fleet"]
    image: ${NUTHATCH_IMAGE:-ghcr.io/nuthatch-indexer/nuthatch:0.8.0-scaled}
    depends_on:
      postgres: { condition: service_healthy }
    command: >-
      serve --dir /nest --listen 0.0.0.0:8288
      --hot-store postgres://nuthatch:nuthatch@postgres:5432/nuthatch
    # Read-only mount: an FE has no business writing to the nest directory, and saying so here means a
    # regression that made it try fails loudly instead of quietly diverging from its peers.
    volumes:
      - ./nest:/nest:ro
    ports:
      - "127.0.0.1:8289-8299:8288"

volumes:
  nuthatch-pg:
