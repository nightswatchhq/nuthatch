name: macos-lto-probe-intel

on:
  push:
    branches: [pete/macos-lto-probe-intel]

jobs:
  probe:
    name: ${{ matrix.os }} cgu=${{ matrix.cgu }} (cross to arm64)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel]
        cgu: ['1', '16']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
        with:
          targets: aarch64-apple-darwin
      - name: runner
        run: |
          sysctl -n hw.ncpu hw.memsize machdep.cpu.brand_string
          sw_vers
      - name: fetch
        run: cargo fetch --locked
      - name: build
        env:
          CARGO_PROFILE_DIST_CODEGEN_UNITS: ${{ matrix.cgu }}
        run: |
          start=$(date +%s)
          /usr/bin/time -l cargo build --profile dist --locked --target aarch64-apple-darwin 2> time.txt || { tail -60 time.txt; exit 1; }
          end=$(date +%s)
          tail -25 time.txt
          bin=target/aarch64-apple-darwin/dist/nuthatch
          echo "RESULT os=${{ matrix.os }} cgu=${{ matrix.cgu }} wall_s=$((end-start)) size_bytes=$(stat -f %z $bin)"
          file $bin
