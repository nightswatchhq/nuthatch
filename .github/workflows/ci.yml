name: ci

on:
  push:
    # Sprint branches get the full gate too. The firm merges into `sprint/**` without peer
    # review - the review requirement was the jam, not the writing - and CI is what still
    # catches real breakage. It runs on GitHub's machines, so it costs no Claude allowance:
    # it is the one gate that is free, and therefore the one to keep.
    branches: [main, 'sprint/**']
  # No `branches:` filter here, deliberately - it filters on the PR's *base*, and a stacked PR
  # (head branch built on another feature branch, not `main`) matched neither the old
  # `[main]` list nor `[main, 'sprint/**']`: zero checks run, and the PR reads as green because
  # an empty check list renders the same as "nothing failed" (#454). Filtering by base can't
  # enumerate every base a stack might use, so the fix is to stop trying - build every PR
  # regardless of what it targets. Forward-ported here (#454/NIG-104) because GitHub evaluates
  # `pull_request` triggers against the workflow file on the PR's *base* branch: `main` alone
  # (#491) doesn't help a PR based on a `pete/*` branch forked from `sprint/diligent-dormouse`,
  # since that branch still carried the filtered version.
  pull_request:

concurrency:
  # A superseded run wastes a runner nobody will read the result of, and doubles the
  # contention this box already feels from concurrent builds (#383). Cancel it - but only
  # for `pull_request`: a new push to a PR should kill that PR's own stale run.
  #
  # `push` to `main`/`sprint/**` must never have `cancel-in-progress` on. Those runs are what a
  # merge queue or the next person's `git pull` waits on - killing a *running* one out from under
  # it turns a real merge gate into a false pass. `cancel-in-progress: false` buys exactly that:
  # the running one survives. It does NOT guarantee every push gets a verdict. GitHub keeps only
  # one *pending* run per concurrency group - a push that arrives while another is still queued
  # (not yet started) cancels the queued one outright, with zero jobs run, regardless of this
  # setting (#523). Under a burst of back-to-back pushes - a sprint close-out, say - intermediate
  # commits can be dropped from the gate silently; only the running run and the latest arrival are
  # ever safe.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # #733. The required check is this name. It used to be one job that compiled clippy and test,
  # each again for `exex`, into one `target/` - four artifact sets, ~69G, ENOSPC on a docs-only
  # PR. The hostedtoolcache reclaim (#639) bought back a few gigabytes and did not change the
  # shape. Splitting the feature sets onto two runners is option 3 on that issue: two disks, two
  # rust-cache keys, clippy+test still sharing artifacts *within* a feature set. A third job
  # keeps the required name so the ruleset does not have to move.
  #
  # `if: always()` so a cancelled or skipped leg still runs this and fails it - a skipped
  # required check is how a red child reads as a green merge.
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    needs: [check-default, check-exex]
    if: always()
    timeout-minutes: 5
    steps:
      - name: both legs green
        run: |
          echo "default: ${{ needs.check-default.result }}"
          echo "exex: ${{ needs.check-exex.result }}"
          if [ "${{ needs.check-default.result }}" != success ] \
            || [ "${{ needs.check-exex.result }}" != success ]; then
            echo "::error::fmt · clippy · test needs both legs green (see check-default and check-exex)"
            exit 1
          fi

  check-default:
    name: fmt · clippy · test (default)
    runs-on: ubuntu-latest
    # 90, not 45 (#584). A `Cargo.lock` change invalidates every `Swatinem/rust-cache` entry at
    # once - the cache key is the lock hash - and this job runs `cargo fmt`/`clippy`/`test` cold
    # from scratch when that happens. Measured on #579's lock change (run 31824503060): the job
    # was still linking at 33 minutes in with a 45m ceiling, no headroom left. 45, not 25 (#525)
    # already established the reasoning: size for the cold tail, not the warm median, because a
    # wider ceiling costs nothing on the happy path and a timeout only bills when it fires. 90
    # is headroom over the cold case, not the new steady state - a run that hits it every time
    # means the cache stopped working, not that 90 was too tight.
    timeout-minutes: 90
    steps:
      # Feeds "an expiry doesn't read as cancelled" below - GitHub gives `cancelled()` steps a
      # grace window to run after a job is killed (proven on #521 itself: its own `if: always()`
      # disk step ran and completed a second after the timed-out test step was cut off), so this
      # survives to report elapsed time even when the job never reaches its last step normally.
      - name: record start time
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # #634. `release.yml` hard-fails when `docs/releases/<tag>.md` is missing, which is right, but
      # it discovers that *after the tag is pushed* - the most expensive moment to find out, and the
      # one where the fix means deleting a tag. The version bump is the moment the notes are owed, so
      # check it here, on the PR that does the bumping, where the cost of being wrong is a red tick.
      #
      # Deliberately a step in this job rather than a job of its own: only the names in
      # `required_status_checks` actually block a merge, and a new job would not be one of them
      # (see the cost of learning that the other way round). First step after checkout so it answers
      # in seconds rather than behind an hour of builds.
      - name: a version bump brings its release notes (#634)
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          git fetch --depth=1 origin main
          base=$(git show origin/main:Cargo.toml | grep -m1 '^version = ' | cut -d'"' -f2)
          if [ "$version" = "$base" ]; then
            echo "version unchanged at $version - nothing owed"
            exit 0
          fi
          notes="docs/releases/v$version.md"
          echo "version $base -> $version, so $notes must exist"
          if [ ! -s "$notes" ]; then
            echo "::error::This PR bumps the version to $version, so tagging v$version will need $notes and it is missing or empty. Write it in this PR - see docs/releases/README.md. Without it the tag fails in release.yml *after* it is pushed, and recovering from that means deleting a pushed tag."
            exit 1
          fi
          echo "$notes present, $(wc -c < "$notes") bytes"
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # #586: save the cache even when the job fails or is cancelled. rust-cache gates its save
          # on success() by default, so a job killed by an expired timeout seeds nothing and the next
          # run starts cold too - the deadlock half of #584, which raising ceilings does not fix.
          # Proven step-level on run 31824503060: rust-cache's post step was *skipped* while
          # checkout's succeeded in the same grace window.
          cache-on-failure: true
          # #733: this key is the default-feature pair only. The exex pair has its own job and key.
          # Mixing them in one cache is how four artifact sets landed on one disk.
          key: check-default
      # #733 moved the `exex` pair onto its own runner. This job holds clippy + test for the
      # default feature set, plus the decode crate's own checks. Two compiles, one `target/`.
      #
      # The `df` lines stay. The ENOSPC on this job (#464, then #733 on a docs-only PR) had to be
      # inferred from SIGBUS the first two times because nothing measured the disk. `if: always()`
      # on the trailing `df` so the reading survives the failure it explains.
      #
      # Pre-#733 combined-job figures, kept so the next person does not re-derive why this split:
      # four artifact sets, ~69G, finishing on 14G free after the hostedtoolcache reclaim (#639,
      # n=2) and on 775M / ENOSPC linking `test (exex)` on 19 August. This job should finish at
      # roughly half that occupant. Re-measure here rather than trusting that sentence.
      - name: reclaim runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost \
            /opt/hostedtoolcache
          df -h /
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test --locked
      # `nuthatch-decode` is a path dependency, and the root manifest has no `[workspace]` table -
      # deliberately, so `fuzz/` stays its own workspace (see nuthatch#581). A consequence nobody
      # intended: cargo builds a path dependency but never runs its unit tests, so the 18 tests
      # #607 moved out of `src/registry.rs` stopped being executed by CI the moment they landed in
      # `decode/src/registry.rs`. Among them is
      # `registry::tests::dirty_high_bits_on_a_sub64_uint_saturate_instead_of_panicking` - the
      # COR-11 oracle, the nightly-free half of the proof that the decode guard works.
      #
      # An extraction that silently drops the tests it moved is this sprint's own theme, so these
      # steps are explicit rather than clever: same three checks, aimed at the other manifest.
      #
      # `CARGO_TARGET_DIR` here is a disk measure, not tidiness: `decode/` is its own workspace, so
      # without it these steps build a *second* artifact set under `decode/target`. Pointing them at
      # the root `target/` costs almost nothing, because `cargo test` above already compiles
      # `nuthatch-decode` as a path dependency into that directory - the only new artifact is
      # decode's own test harness.
      #
      # **It buys ~0.4 GB, and that is not what the ENOSPC above was about.** Measured, because the
      # first guess was wrong and worth recording so nobody re-guesses it:
      #
      #   job 95791757824 (1526cb2, 18 Aug, *before* these steps)  136G used,  9.2G free
      #   job 95990278738 (#623, the PR that added them)           136G used,  8.8G free
      #   job 96013820700 (#630, docs-only, 19 Aug)                144G used,  775M -> ENOSPC
      #
      # So the job was already finishing at 94% before the decode steps existed, and a docs-only PR
      # is what tipped it. The variable is cache-restore size between runs, exactly as the paragraph
      # above says. Reclaiming 0.4 GB is worth doing and does not fix it.
      - name: fmt (decode)
        run: cargo fmt --check --manifest-path decode/Cargo.toml
      - name: clippy (decode)
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: cargo clippy --all-targets --manifest-path decode/Cargo.toml -- -D warnings
      - name: test (decode)
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: cargo test --locked --manifest-path decode/Cargo.toml
      # What was left when the longest step finished, or when it died. A job that can fail of
      # exhaustion has to report what it had, or the next failure is guessed at like the last two.
      - name: disk after the builds
        if: always()
        run: df -h /
      # #525: `cancelled` is what GitHub reports for a human cancel, a `pull_request` supersede,
      # AND an expired `timeout-minutes` - one word, three causes, and the checks list gives a
      # reader nothing to tell them apart. There is no separate conclusion for an expired timeout,
      # and no way to make the checks list itself say something else - only this job's own log
      # can. So: do the subtraction here and print it, rather than leaving a reader to open the
      # job and do it by hand. A run cancelled seconds after it started is plainly a real
      # cancel/supersede; one that ran to (or past) the ceiling below is plainly an expiry. If it
      # lands in between, that's the genuinely ambiguous case, and the numbers are what let a
      # reader judge it instead of guessing from the icon.
      - name: distinguish an expired timeout from a cancel or supersede
        if: always() && cancelled()
        run: |
          # An unset start time is not a missing answer, it is one. Shell arithmetic reads an
          # empty variable as 0, so the subtraction below would print the epoch itself as the
          # elapsed time (measured on the probe run: 1786623050, i.e. 29,777,050m) and the
          # sentence would then read as a confident expiry. The only way to reach this step
          # without a start time is to be cut before the job's first step finished, which is
          # seconds in, and therefore the one case that cannot be an expiry.
          if [ -z "${JOB_START_EPOCH:-}" ]; then
            echo "::warning::This job's conclusion is 'cancelled' and it was cut before its first step recorded a start time - seconds in, so an expiry of the 90m timeout-minutes ceiling is not what happened. This is a human cancel or a concurrency supersede."
            exit 0
          fi
          elapsed_s=$(( $(date +%s) - JOB_START_EPOCH ))
          echo "::warning::This job's conclusion is 'cancelled' - GitHub reports that identically for a human cancel, a concurrency supersede, and an expired timeout-minutes, with no separate conclusion for the third. This run's steps ran for $((elapsed_s / 60))m$((elapsed_s % 60))s against this job's 90m timeout-minutes ceiling. Close to 90m: almost certainly an expiry, not a cancel. Well under it: almost certainly a real cancel or supersede."

  check-exex:
    name: fmt · clippy · test (exex)
    runs-on: ubuntu-latest
    # Same 90m ceiling as the default leg (#584). Cold-cache is a full clippy+test of the exex
    # feature set from scratch; this used to share a disk with that pair and lose.
    timeout-minutes: 90
    steps:
      - name: record start time
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true
          key: check-exex
      # Feature-gated code is invisible to the default lint, and `exex` had never been built
      # here at all - so its only test had been failing `-D warnings` unnoticed (#423). A
      # feature nobody lints is a feature that rots silently. It now has its own runner so it
      # cannot fill the disk the default pair is using (#733).
      - name: reclaim runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost \
            /opt/hostedtoolcache
          df -h /
      - name: clippy (exex)
        run: cargo clippy --features exex --all-targets -- -D warnings
      - name: test (exex)
        run: cargo test --features exex --locked
      - name: disk after the builds
        if: always()
        run: df -h /
      - name: distinguish an expired timeout from a cancel or supersede
        if: always() && cancelled()
        run: |
          if [ -z "${JOB_START_EPOCH:-}" ]; then
            echo "::warning::This job's conclusion is 'cancelled' and it was cut before its first step recorded a start time - seconds in, so an expiry of the 90m timeout-minutes ceiling is not what happened. This is a human cancel or a concurrency supersede."
            exit 0
          fi
          elapsed_s=$(( $(date +%s) - JOB_START_EPOCH ))
          echo "::warning::This job's conclusion is 'cancelled' - GitHub reports that identically for a human cancel, a concurrency supersede, and an expired timeout-minutes, with no separate conclusion for the third. This run's steps ran for $((elapsed_s / 60))m$((elapsed_s % 60))s against this job's 90m timeout-minutes ceiling. Close to 90m: almost certainly an expiry, not a cancel. Well under it: almost certainly a real cancel or supersede."

  pg-parity:
    name: scaled mode (parity · control plane · reconcile)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nuthatch
          POSTGRES_PASSWORD: nuthatch
          POSTGRES_DB: nuthatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nuthatch -d nuthatch"
          --health-interval 3s --health-timeout 3s --health-retries 20
    # 60, not 25 (#584). Same cold-cache exposure as `check` above: a `Cargo.lock` change
    # invalidates this job's own `Swatinem/rust-cache` entry, and `clippy (postgres-store)` plus
    # the parity suite then compile from scratch. Measured on #579's lock change (run
    # 31824503060): killed at the 25m ceiling mid-`parity suite`, with `clippy (postgres-store)`
    # alone having taken 12m30s cold.
    timeout-minutes: 60
    steps:
      - name: record start time
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # #586: save the cache even when the job fails or is cancelled. rust-cache gates its save
          # on success() by default, so a job killed by an expired timeout seeds nothing and the next
          # run starts cold too - the deadlock half of #584, which raising ceilings does not fix.
          # Proven step-level on run 31824503060: rust-cache's post step was *skipped* while
          # checkout's succeeded in the same grace window.
          cache-on-failure: true
      # Clippy runs **first**, deliberately. It compiles `--all-targets` under this feature, which is a
      # superset of what the test step needs, so running it first warms the shared cache and the test
      # step reuses it. In the other order both steps did a near-full build of duckdb, wasmtime and
      # dbsp - the job's first run took ~30 minutes, most of it compiling the same crates twice.
      #
      # It also fails faster on the common breakage: a lint error surfaces before a database is
      # touched, rather than after the longer of the two builds.
      #
      # The scaled backend must not rot behind its feature flag either - the default build never
      # compiles it, so no other job would notice it breaking.
      - name: clippy (postgres-store)
        run: cargo clippy --features postgres-store --all-targets -- -D warnings
      # `NUTHATCH_REQUIRE_PG` turns a missing URL into a failure. Without it a misconfigured service
      # container would make the suite skip and still report green, which is the failure mode this
      # job exists to prevent - a parity gate that quietly stops comparing is worse than none.
      - name: parity suite
        env:
          NUTHATCH_TEST_PG: postgres://nuthatch:nuthatch@127.0.0.1:5432/nuthatch
          NUTHATCH_REQUIRE_PG: "1"
        run: |
          # Every Postgres-backed suite, not just parity: the control plane and the reconcile loop
          # have no coverage anywhere else, and a job named for one of three would let the other two
          # rot behind the feature flag.
          cargo test --locked --features postgres-store \
            --test pg_parity --test control_plane --test e2e_reconcile --test control_api \
            --test secret_isolation --test e2e_resolution -- --test-threads=1
      # See the identical step in `check` above for why this exists: `cancelled` alone cannot
      # tell a reader an expired `timeout-minutes` apart from a human cancel or a concurrency
      # supersede (#584 hit exactly this - it read as a plain cancel until someone did the
      # subtraction by hand).
      - name: distinguish an expired timeout from a cancel or supersede
        if: always() && cancelled()
        run: |
          if [ -z "${JOB_START_EPOCH:-}" ]; then
            echo "::warning::This job's conclusion is 'cancelled' and it was cut before its first step recorded a start time - seconds in, so an expiry of the 60m timeout-minutes ceiling is not what happened. This is a human cancel or a concurrency supersede."
            exit 0
          fi
          elapsed_s=$(( $(date +%s) - JOB_START_EPOCH ))
          echo "::warning::This job's conclusion is 'cancelled' - GitHub reports that identically for a human cancel, a concurrency supersede, and an expired timeout-minutes, with no separate conclusion for the third. This run's steps ran for $((elapsed_s / 60))m$((elapsed_s % 60))s against this job's 60m timeout-minutes ceiling. Close to 60m: almost certainly an expiry, not a cancel. Well under it: almost certainly a real cancel or supersede."

  fleet:
    name: the compose fleet comes up
    # The compose stack requires its credentials rather than shipping defaults, so CI supplies them
    # like any other operator. Job-level because several steps invoke `docker compose` and a missing
    # value fails interpolation before a single container starts. These are throwaway values for an
    # ephemeral runner - the point of the `:?` in the compose file is that *choosing* them is
    # deliberate, not that they are secret here.
    env:
      POSTGRES_PASSWORD: ci-postgres-password
      NUTHATCH_CONTROL_TOKEN: ci-control-token
    # **ubuntu-22.04, not ubuntu-latest**, and for the same reason the release job is pinned: a
    # dynamically-linked binary needs the glibc it was built against *or newer*, and `Dockerfile` is
    # `debian:bookworm-slim` (glibc 2.36). Building on 24.04 (2.39) produces a binary the image cannot
    # run - `version GLIBC_2.39 not found`.
    #
    # This is the **third** time this exact trap has bitten: the release binary (#189), a local
    # cross-build against `rust:1.95` (trixie, 2.41), and now this job. The rule is simple and worth
    # stating so a fourth is avoided: **any job that builds a binary destined for the container image
    # must build on a base no newer than the Dockerfile's.**
    runs-on: ubuntu-22.04
    # 60, not 30 (#584). This job survived #579's cold-cache run at 25m18s against a 30m
    # ceiling - 4m42s of margin, which is luck (this job's `Swatinem/rust-cache` also keys on
    # `Cargo.lock`), not headroom. 60 matches the same cold-cache reasoning applied to `check`,
    # `build-release` and `pg-parity` above rather than banking on that margin holding again.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # #586: save the cache even when the job fails or is cancelled. rust-cache gates its save
          # on success() by default, so a job killed by an expired timeout seeds nothing and the next
          # run starts cold too - the deadlock half of #584, which raising ceilings does not fix.
          # Proven step-level on run 31824503060: rust-cache's post step was *skipped* while
          # checkout's succeeded in the same grace window.
          cache-on-failure: true
          key: fleet-postgres-store
      # This job exists because of four bugs that 41 passing tests never touched, found the first time
      # the stack was actually brought up: a migration race (`CREATE … IF NOT EXISTS` is not atomic in
      # Postgres, and the control plane plus every worker migrate at startup), a control plane that
      # refused to start because Docker publishes ports by binding 0.0.0.0 inside the container, an FE
      # that died on a `:ro` mount, and an undocumented `./nest` requirement.
      #
      # Every one of them is a *composition* failure - the parts were individually correct. Nothing
      # short of standing the thing up finds those.
      - name: build the scaled binary
        run: cargo build --release --locked --features postgres-store
      - name: build the scaled image
        run: |
          mkdir -p .fleet && cp target/release/nuthatch .fleet/ && cp Dockerfile .fleet/
          docker build -t nuthatch-scaled:ci .fleet
          docker run --rm nuthatch-scaled:ci worker --help > /dev/null
          docker run --rm nuthatch-scaled:ci control --help > /dev/null
      # The fleet mounts ./nest, and its absence is the fourth bug. A minimal nest is enough: this job
      # verifies the *topology*, not indexing - RPC access from CI would make it flaky for no gain.
      - name: scaffold a minimal nest
        run: |
          mkdir -p nest/abis
          cat > nest/nuthatch.toml <<'TOML'
          [nest]
          name = "ci"
          chain = "arbitrum-one"
          chain_id = 42161
          rpc_urls = ["https://arb1.arbitrum.io/rpc"]

          [[contracts]]
          alias = "usdc"
          address = "0xaf88d065e77c8cC2239327C5EDb3A432268e5831"
          abi = "abis/usdc.json"
          TOML
          cat > nest/abis/usdc.json <<'JSON'
          [{"type":"event","name":"Transfer","inputs":[
            {"name":"from","type":"address","indexed":true},
            {"name":"to","type":"address","indexed":true},
            {"name":"value","type":"uint256","indexed":false}],"anonymous":false}]
          JSON
          # uid 10001: the image runs unprivileged, so a root-owned bind mount is unwritable to it.
          # This passes on Docker Desktop (which fakes mount permissions) and fails on Linux - so a CI
          # runner is the right place to catch it, and this line is why the job would have.
          sudo chown -R 10001:10001 nest
      - name: bring the fleet up
        env:
          NUTHATCH_IMAGE: nuthatch-scaled:ci
        run: |
          docker compose -f docker-compose.scaled.yml --profile fleet up -d \
            --scale writer=2 --scale fe=2
          # Wait for the control plane…
          for i in $(seq 1 30); do
            curl -fsS -m 3 localhost:8290/health >/dev/null 2>&1 && break
            sleep 2
          done
          # …and then for a worker to actually register. Waiting only for the control plane is not
          # enough: workers reconcile on a 5s tick, so a verify run that starts the instant the API is
          # up sees an empty registry. That made two level-5 checks fail on a *timing* problem and read
          # as product failures - `5.10` in particular, because with no workers the unplaceable reason
          # is `noworkers` rather than the budget one it was asserting.
          for i in $(seq 1 30); do
            n=$(curl -fsS -m 3 -H "authorization: Bearer $NUTHATCH_CONTROL_TOKEN" \
              localhost:8290/workers | python3 -c 'import sys,json;print(json.load(sys.stdin)["count"])' 2>/dev/null || echo 0)
            [ "${n:-0}" -ge 1 ] && { echo "workers registered: $n"; break; }
            sleep 2
          done
      - name: every service is running
        run: |
          # The assertion that would have caught three of the four bugs: nothing exited.
          exited=$(docker compose -f docker-compose.scaled.yml --profile fleet ps -a \
            --format '{{.Service}} {{.State}}' | awk '$2 != "running"')
          if [ -n "$exited" ]; then
            echo "::error::services are not running:"; echo "$exited"
            docker compose -f docker-compose.scaled.yml --profile fleet logs --tail 30
            exit 1
          fi
          docker compose -f docker-compose.scaled.yml --profile fleet ps \
            --format '{{.Service}} {{.State}}'
      - name: walk verification.md level 5
        env:
          NUTHATCH: target/release/nuthatch
          CONTROL_TOKEN: ${{ env.NUTHATCH_CONTROL_TOKEN }}
        run: ./scripts/verify.sh 5
      - name: a worker takes a lease and only one does
        run: |
          # Declare on a chain a worker hosts, then assert exactly one acquisition. This is the
          # single-owner invariant, read from the workers' own logs - the control plane records intent,
          # the lease records ownership, so asking the control plane would prove nothing.
          curl -fsS -X POST localhost:8290/nests \
            -H "authorization: Bearer $NUTHATCH_CONTROL_TOKEN" \
            -H 'content-type: application/json' \
            -d '{"name":"ci","chain":"arbitrum-one","estimated_rss_mb":120}'
          sleep 12
          n=$(docker compose -f docker-compose.scaled.yml logs writer 2>&1 \
            | grep -c 'acquired cursors' || true)
          echo "acquisitions: $n"
          if [ "$n" -ne 1 ]; then
            echo "::error::expected exactly one worker to acquire the cursor, got $n"
            docker compose -f docker-compose.scaled.yml logs writer --tail 40
            exit 1
          fi
      - name: teardown
        if: always()
        run: docker compose -f docker-compose.scaled.yml --profile fleet down -v

  deny:
    name: cargo-deny (vulns · licences · bans)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Dependency vulnerability scan (RUSTSEC) + permissive-only licence gate + banned-crate check.
      # Config + the honest ignore-list rationale live in deny.toml.
      #
      # `rust-version` pins the cargo-deny build. On 2026-07-31 the pinned one could not parse a newly
      # published advisory that uses **CVSS 4.0**, so the whole advisory database failed to load and
      # the job errored - on every PR. It failed *closed*, which is the right direction, but it also
      # masked a real finding: once a parsing version ran, RUSTSEC-2026-0220 (`ruint` shift ops) turned
      # out to be live in our tree, through alloy's decode path.
      #
      # The lesson for whoever touches this next: the advisory DB is a live external input whose schema
      # moves. A scanner that hard-fails on an unknown CVSS version is one upstream change away from
      # blocking every release - so keep this current rather than pinned-and-forgotten.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories licenses bans sources

  build-release:
    name: build release
    runs-on: ubuntu-latest
    # 45, not 20 (#584). Warm this job is 3m40s-5m12s; cold - triggered by any `Cargo.lock`
    # change, since `Swatinem/rust-cache` keys on the lock hash - it is a full `--release` build
    # from scratch. Measured on #579's lock change (run 31824503060): killed at the 20m ceiling
    # still linking `nuthatch` itself.
    timeout-minutes: 45
    steps:
      - name: record start time
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # #586: save the cache even when the job fails or is cancelled. rust-cache gates its save
          # on success() by default, so a job killed by an expired timeout seeds nothing and the next
          # run starts cold too - the deadlock half of #584, which raising ceilings does not fix.
          # Proven step-level on run 31824503060: rust-cache's post step was *skipped* while
          # checkout's succeeded in the same grace window.
          cache-on-failure: true
      - name: build
        run: cargo build --release --locked
      - name: upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuthatch-release
          path: target/release/nuthatch
          retention-days: 1
      # See the identical step in `check` above for why this exists: `cancelled` alone cannot
      # tell a reader an expired `timeout-minutes` apart from a human cancel or a concurrency
      # supersede (#584 hit exactly this - it read as a plain cancel until someone did the
      # subtraction by hand).
      - name: distinguish an expired timeout from a cancel or supersede
        if: always() && cancelled()
        run: |
          if [ -z "${JOB_START_EPOCH:-}" ]; then
            echo "::warning::This job's conclusion is 'cancelled' and it was cut before its first step recorded a start time - seconds in, so an expiry of the 45m timeout-minutes ceiling is not what happened. This is a human cancel or a concurrency supersede."
            exit 0
          fi
          elapsed_s=$(( $(date +%s) - JOB_START_EPOCH ))
          echo "::warning::This job's conclusion is 'cancelled' - GitHub reports that identically for a human cancel, a concurrency supersede, and an expired timeout-minutes, with no separate conclusion for the third. This run's steps ran for $((elapsed_s / 60))m$((elapsed_s % 60))s against this job's 45m timeout-minutes ceiling. Close to 45m: almost certainly an expiry, not a cancel. Well under it: almost certainly a real cancel or supersede."

  footprint:
    name: footprint (RAM budget)
    needs: build-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: download binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuthatch-release
          path: bin
      - name: measure peak RSS
        # Ceiling is 256 MB: generous headroom over the measured ~60 MB for this fixture, far under
        # the 2 GB product budget. NOT continue-on-error - the RAM budget is a real gate.
        #
        # **No secret, and no third party.** This used to index mainnet USDC over the shipped public
        # endpoints, optionally overridden by a FOOTPRINT_RPC secret. Secrets are not exposed to fork
        # PRs, so an external contribution could never satisfy a required check - it failed on the
        # honest "indexed 0 transfers, refusing to false-pass" path and a maintainer had to wave it
        # through, which is how a gate stops meaning anything (issue #260, hit by PR #253). The peak
        # was also incomparable between runs, since it depended on how many blocks a rate-limited
        # endpoint served.
        #
        # The script now serves the chain itself (footprint-rpc.py) and writes the nest inline rather
        # than calling `init`, so there is no RPC and no ABI lookup. Every run indexes exactly 8004
        # rows: a change in peak RSS is a change in nuthatch, and a fork behaves identically.
        env:
          BIN: bin/nuthatch
          MAX_RSS_MB: "256"
        run: |
          chmod +x bin/nuthatch
          bash .github/workflows/footprint.sh

  point-read:
    name: point-read latency
    needs: build-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: download binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuthatch-release
          path: bin
      - name: measure entity point-read p50/p99
        # Issue #283. CLAUDE.md names entity point-read p50/p99 as a CI artifact whose regressions
        # fail the build; `nuthatch bench query` measured it and nothing compared the number to
        # anything, so a scan where there was a seek could land unnoticed.
        #
        # Same hermetic shape as `footprint` above - the chain is served by multinest-rpc.py and the
        # nest is written inline - so there is no secret, no third party, and a fork PR can satisfy
        # it. Every run indexes 200,200 rows across ten tables (real 10-event Uniswap V4 PoolManager
        # ABI, 200 logs/block), of which 12,800 stay hot once everything past finality has sealed.
        # That is the same fixture the `per-cursor RAM budget` job runs (#424).
        #
        # **The ceiling comes from a measured mutation, not from a guess.** Replacing the B-tree seek
        # in `get_entity` with a linear scan - the exact regression this gate exists to catch - was
        # run as a draft PR on `ubuntu-latest` (4 cores, 16 GB), 200,200 rows indexed, 12,800 hot:
        #
        #   baseline             p50 0.94µs    p99 1.50µs    p99.9 4.23µs
        #   scan mutation        p50 697.67µs  p99 1397.32µs
        #   contrast (256 hot)   p50 14.38µs   p99 28.31µs
        #
        # So p50 gates at **8µs**. The healthy baseline is 8.5x below it; the linear-scan mutation
        # is 87x above it. The 256-hot-row control shows the same mutation at only 14µs - 1.8x above
        # an 8µs ceiling - demonstrating that the realistic fixture is 50x more sensitive to this
        # regression. Both sides measured on the same runner, with the enforcement runner enforcing.
        #
        # Known sensitivity boundary: this discriminates a full linear scan over a 12,800-row hot
        # store. A regression that lands under 8µs - a very partial scan, or one over a much smaller
        # store - passes. The gate is a floor on gross regressions, not a microbenchmark.
        #
        # **The tail is tracked, not gated - CI enforces p50 and nothing else.** Gating loosely and
        # tracking precisely are two different jobs, and one ceiling cannot do both: a p99 tight
        # enough to catch a regression flakes on a shared VM, and one loose enough to survive catches
        # nothing. This job used to carry a 150µs p99 backstop at ~150x baseline on the second horn of
        # that, and the measurement above settles it - the linear-scan mutation p50 catches at 18.15µs
        # only moved **p99 to 34.45µs**, so that backstop did not fire on the single regression this
        # gate exists to catch. A ceiling that passes the known break is not a weak gate; it is
        # decoration that reads as coverage, and a required check that reads as coverage is worse than
        # no check because it stops anyone looking.
        #
        # So p99 and p99.9 go in the artifact and the step summary, and nothing compares them to a
        # number. They are what we read across releases. p99 over 256 samples is the 4th-worst read
        # and preemption-dominated here; p99.9 swung 0.77-3.96µs at fixed commits. Neither is a
        # property of the read path on this hardware, which is exactly why neither can fail a build.
        #
        # **`BASELINE` is what stops the reference rotting again** (issue #385).
        # `docs/bench/point-read.json` is now this job's own artifact - taken verbatim from a green
        # CI run on this PR, commit 6de5647, p50 0.94µs - rather than the 32-core dev-box report (p50 1.24µs)
        # that sat there while the gate ran here. Nothing caught that, because a committed number
        # cannot go stale loudly: it can only be read and believed, which is why `bench query`'s FAIL
        # message had to spend four lines telling readers not to believe it. The script now compares
        # the `hardware` the baseline records against the `hardware` this run records, and fails on a
        # mismatch. If GitHub changes what `ubuntu-latest` is, this goes red and wants a human -
        # correct, because the 8µs ceiling above was measured on the old spec.
        env:
          BIN: bin/nuthatch
          MAX_P50_US: "8"
          BASELINE: docs/bench/point-read.json
          OUT: point-read-report.json
        run: |
          chmod +x bin/nuthatch
          bash .github/workflows/point-read.sh
      - name: upload report
        # Always: a run that failed the gate is the report you most want to read.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: point-read-report
          path: point-read-report.json
          retention-days: 30


  multinest-footprint:
    name: per-cursor RAM budget (dense multi-nest)
    needs: build-release
    runs-on: ubuntu-latest
    # TIMEOUT_S (default 1800s = 30 min) bounds the harness's own wait loop; this is the backstop for
    # everything around it (checkout, artifact download, RPC startup) plus headroom, so a harness bug
    # can never hold a runner for GitHub's 6-hour job default (#449).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: download binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuthatch-release
          path: bin
      - name: measure peak RSS at tip
        # The ≤2 GB per-cursor budget (CLAUDE.md non-negotiable 2, RFC-0021) measured on the case
        # most likely to break it: 20 nests on ONE cursor, the real 10-event Uniswap V4 PoolManager
        # ABI, 200 logs per block across the cursor, and 200 blocks of live tip-following after the
        # backfill drains. Issues #286 (measure it) and #284 (stop the answer rotting).
        #
        # **This does not duplicate the `footprint (RAM budget)` job above, and the two ceilings must
        # not be reconciled into one.** That job is the single-nest backfill regression tripwire: one
        # contract, one event type, 8004 rows, 256 MB. Its sensitivity comes from its scenario being
        # small. This job is the product budget on the adversarial scenario. Neither subsumes the
        # other, and no single number can be both a tight tripwire and a 2 GB product promise.
        #
        # Two ceilings here, saying different things:
        #   MAX_RSS_MB=2048    the budget. A promise, not a tuning parameter. Never raise it.
        #   REGRESSION_MB      the regression ceiling, set outside the measured run-to-run noise
        #                      band (see scripts/multinest-rss-spread.sh). The budget alone cannot
        #                      be a regression gate: the scenario measures ~145 MB, so a change
        #                      could cost ten times the memory and still pass 2048.
        #
        # No secret and no third party - multinest-rpc.py serves the chain, the nests are written
        # inline, and topic0s are derived from the same ABI file the harness writes. A fork PR can
        # satisfy it, which was the whole lesson of #260.
        #
        # The scenario itself - nests, event rate, block span, tip - is **not** set here. It is the
        # harness's own defaults, so that the bare command in docs/benchmarks.md, the re-baseline
        # tool the FAIL message tells an operator to run, and this gate all describe one scenario
        # (#395). Restating them here would let the two copies drift, and the copy every human reads
        # is the one in the harness. Set below: only what belongs to the job - the enforcement
        # policy, and where to write the artifact.
        env:
          BIN: bin/nuthatch
          MAX_RSS_MB: "2048"
          # 466, re-baselined on this runner for #1067. The tip path now holds until
          # SEAL_DIRECT_BATCH (20,000 rows) before sealing. This scenario is 12,010 rows/nest,
          # so nothing seals and the whole 240,200 rows stay in the hot store.
          #
          #   runner after #1067        372 MB     CI run 33602467469, this PR
          #   REGRESSION_MB             466 MB     372 * 1.25 + 1, the spread script's formula
          #   MAX_RSS_MB               2048 MB     unchanged; 1676 MB of budget still free
          #
          # The previous 180 / 131 / 323 numbers described the old tip path, which sealed every
          # finality advance and left almost nothing hot. They are not this scenario any more.
          # A same-shaped +192 MB leak on the new baseline would land around 564 MB, which 466
          # still catches. A 7-run band on the runner (scripts/multinest-rss-spread.sh) is the
          # follow-up if this number starts to flake; do not lower it from a smaller local run.
          REGRESSION_MB: "466"
          REPORT: multinest-footprint.json
        run: |
          chmod +x bin/nuthatch
          bash .github/workflows/multinest-footprint.sh
      - name: measure peak RSS, wide ABI, one nest (#286)
        # The density job above is twenty nests × ten events. This is one nest × 31 events - the
        # ABI-breadth half #286 asked for and the density job cannot answer. Same binary, same
        # budget, a different pressure on the hot store. Floor: every table non-empty.
        env:
          BIN: bin/nuthatch
          MAX_RSS_MB: "2048"
          REPORT: wideabi-footprint.json
        run: |
          chmod +x bin/nuthatch
          bash .github/workflows/wideabi-footprint.sh
      - name: upload the report
        # The measurement is a CI artifact, per CLAUDE.md. It is also what re-baselining reads: the
        # ceilings above are one machine's numbers and want revisiting from the runner's own reports.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: multinest-footprint-report
          path: |
            multinest-footprint.json
            wideabi-footprint.json
          if-no-files-found: warn
          retention-days: 30

  fuzz-smoke:
    name: fuzz smoke (decode path)
    runs-on: ubuntu-latest
    # A short, bounded regression run, not a real fuzzing campaign - libFuzzer needs a fresh
    # sanitizer-instrumented build (SanitizerCoverage), which only exists on nightly, so this
    # deliberately does not share the pinned-1.95.0 toolchain the rest of CI uses. That pin is about
    # keeping the *shipped binary* reproducible (Cargo.toml's rust-version comment); fuzz/ is dev-only
    # tooling excluded from the published crate, same as components/ and scratchpad/.
    #
    # The decode path (nuthatch-decode crate, PR #607) no longer links dbsp, so the rustc ICE
    # computing a vtable slot for dbsp's `StarJoinFuncTrait`/`DynClone` under sanitizer
    # instrumentation cannot recur. ASan and debug-assertions are now restored: `-O` and
    # `--sanitizer none` workarounds have been removed (see the run step below).
    #
    # `continue-on-error` is gone: this job is now a real gate. A failure here means a regression
    # in the decode path - it must be fixed before merging.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly
      # #586 applies here more sharply than anywhere else in this file. This job carries
      # `timeout-minutes: 45` and observed 40m26s on PR #592 - four and a half minutes of headroom,
      # nearly all of it `cargo install cargo-fuzz --locked` plus three nightly targets built from
      # cold. It is by some distance the likeliest job in the repo to be killed by its own ceiling,
      # and without `cache-on-failure` it would be the one job that seeds nothing when killed, so
      # the next run starts cold too and is killed again. `continue-on-error` hides that entirely: a
      # job killed by its timeout still reports **success** to the checks API, so the deadlock would
      # tighten with nothing on screen to say so.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: fuzz -> target
          cache-on-failure: true
      - name: install cargo-fuzz
        env:
          RUSTUP_TOOLCHAIN: nightly
        run: cargo install cargo-fuzz --locked
      - name: fuzz decode path (nuthatch#290)
        # abi_json and decode_log are bounded by iteration count, not wall time: both exhaust
        # -runs=300000 in single-digit/low-double-digit seconds on every recorded run, so runner
        # speed doesn't change what they cover run to run. abi_arbitrary is not - it has never once
        # reached -runs in any recorded run (nuthatch#719), so it always pays the full time budget
        # instead, which is what made it 87-90% of this step's wall-clock despite being one of three
        # equally-weighted targets (nuthatch#621).
        #
        # abi_arbitrary therefore gets its own, shorter budget rather than inheriting the other two's
        # 180s. #621 asked whether that number could be picked without guessing - it can, and #603 is
        # the cautionary tale for skipping the measurement: -max_total_time=60 vs 180, three runs
        # each from a clean (checked-in-seeds-only) corpus to match CI's actual cold start, median
        # figures:
        #   60s:  1449 edges, 5107 features, ~3.5k execs
        #   180s: 1462 edges, 5353 features, ~8.3k execs
        # 60s keeps 99.1% of the edge coverage and 95.4% of the feature coverage 180s finds, for
        # roughly a third of the wall-clock. A nightly long-run leg (the other option #621 raised)
        # was considered and rejected: fuzz/corpus/ is never cached or committed between CI runs
        # (only target/ is, via rust-cache below), so a longer nightly run would just rediscover the
        # same territory from the same three checked-in seeds and bank nothing for the next PR -
        # persisting that would need the corpus committed back, which is a CI redesign of its own and
        # out of scope here.
        #
        # Seeds under fuzz/corpus/abi_json/ are checked in - see that directory's corpus/.gitignore
        # carve-out - so this always starts from the shapes the issue named (duplicate topic0,
        # absurd tuple depth, a huge fixed-array size) rather than from an empty corpus RNG luck
        # would have to rediscover on every run. `abi_arbitrary` and `decode_log` build their own
        # inputs structurally (see the file-level docs on each target) and don't need a checked-in
        # seed corpus to reach the same shapes.
        #
        # RUSTUP_TOOLCHAIN=nightly overrides the workspace rust-toolchain.toml (which pins 1.95.0
        # for the shipped binary). Without it, cargo-fuzz's internal `cargo build` invocation runs
        # from the workspace root and picks up the workspace toolchain pin rather than the nightly
        # installed by dtolnay/rust-toolchain above.
        env:
          RUSTUP_TOOLCHAIN: nightly
        run: |
          for target in abi_json decode_log; do
            echo "::group::$target"
            cargo fuzz run "$target" -- -runs=300000 -max_total_time=180 -print_final_stats=1
            echo "::endgroup::"
          done
          echo "::group::abi_arbitrary"
          cargo fuzz run abi_arbitrary -- -runs=300000 -max_total_time=60 -print_final_stats=1
          echo "::endgroup::"
