# Publishes `server.json` to the official MCP Registry as `io.github.nightswatchhq/nuthatch`.
#
# By GitHub OIDC rather than `mcp-publisher login github`: the interactive login grants an
# organisation's namespace only when the registry's GitHub app can read the caller's role there, and
# for this organisation it cannot, so an owner gets `io.github.<user>/*` and a 403 (2026-10-01).
#
# Run by hand, after the release whose image `server.json` names has been published.
name: mcp registry

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: publish server.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: fetch mcp-publisher 1.8.1
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - name: publish
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
