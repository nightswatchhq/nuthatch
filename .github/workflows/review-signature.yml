# Did anyone actually review this?
#
# Ten required contexts on `main`, strict, admin-enforced - and until this file existed, not one of
# them asked whether a human or agent had ever read the change. (Counts drift; the list is read from
# the API, see below. Protected `sprint/*` branches are close but not identical - four of the six are
# missing `fuzz smoke (decode path)`, which is nuthatch#715's problem, not this file's.) The
# `Reviewed-by:` rule was honour-system, checked only by a post-hoc audit grep that runs long after
# the merge. `gh pr merge --auto` arms on an unsigned PR quite happily and lands it the instant the
# last context goes green.
#
# **Three near-misses, one measured.** 2026-08-14 ~19:40 UTC: #583, #588 and #589 all had auto-merge
# armed with no signature in the body. #583 was one check away and carried a real defect (`/ready`
# returning 503 on a healthy cursor at tip). It was caught by a CEO heartbeat happening to land in
# the right ten-minute window, which is luck, not a control. This job is the control (NIG-235).
#
# ## This job is only a control while `reviewed-by signature` is a *required* context
#
# It was not, until 2026-08-21. The job existed, ran on every PR, and went red exactly as designed -
# onto a checks list where nothing consumed it. Branch protection required nine other contexts and
# never this one, so a red signature blocked no merge, and `gh pr merge --auto` still landed on the
# ninth green context without reading it. #619 and #691 then sharpened the matcher inside a job that
# gated nothing, and were closed on the strength of it. The apparatus below - the roster, the
# self-tests, the both-directions mutation argument - was decorative for a reason none of it can
# see from in here.
#
# The span is bounded at both ends by measurement, not by inference, because the claim "this was
# never wired up" is exactly the kind that gets asserted rather than checked:
#
#   - **Not required at the end.** Read directly on 2026-08-21: nine contexts on `main`, this not
#     among them, and `rules/branches/main` returning `[]` so no ruleset supplied it either.
#   - **Not required near the start.** #585, #588, #590, #591, #592, #595 and #596 all merged with
#     this context *absent* from their head commit - no check-run of this name at all. A required
#     context that never reports is unsatisfiable and blocks the merge forever, so those merges are
#     only possible if it was not required when they happened.
#   - **The middle is inferred, not proven.** Every PR merged after those has this context green,
#     so no merge demonstrates the gap directly, and the org audit log is not readable with the
#     token this firm uses. It could in principle have been required and then removed. Nothing
#     suggests that and nobody recalls it, but it is not measured, and this comment will not
#     pretend otherwise.
#
# So the load-bearing artefact is not this file. It is the entry in
# `required_status_checks.contexts` on every branch a PR can target, and it lives in GitHub's
# settings, not the repo. Nothing in this workflow can assert its own requiredness: a job cannot
# tell whether anyone is listening. Two consequences, both operational:
#
#   - **A new `sprint/*` branch starts unprotected.** Protection here is per-branch, not a pattern
#     rule (`repos/.../rules/branches/main` returns `[]` - there are no rulesets). Creating
#     `sprint/foo` and opening PRs onto it gets you nothing until protection is copied onto it,
#     this context included. That is a checklist item at sprint start, not an inference.
#   - **Check it, don't assume it.** `gh api repos/nightswatchhq/nuthatch/branches/main/protection
#     --jq '.required_status_checks.contexts'` must contain `reviewed-by signature`. If it does
#     not, this job is back to being scenery and every merge since is unsigned-capable.
#
# ## The roster (#619, #691)
#
# The first cut of this job checked only that *some* non-blank text followed the colon. Two holes
# followed directly from that: `Reviewed-by: pending` is non-blank and passed (#619), on live PR
# #617; and the self-review refusal below compares against the PR's GitHub *login*, which is
# `cargopete` for every PR this firm opens, while reviewers sign as firm agents or as the shared git
# identity `pete-fathom` - name spaces that never intersect, so that refusal could never fire here
# and #688 went through self-signed as `pete-fathom` (#691).
#
# Both close the same way: `.github/reviewers.txt` is a committed allowlist of the parties who may
# **sign** - not who may author, there is no outside-contributor exemption to build, since an
# outside PR is reviewed and signed by one of the same parties. `pending` is not on it. Neither is
# `pete-fathom` or `cargopete` - not refused by name, simply absent, because the roster is who can
# read a diff and neither of those denotes a party who can. See the roster file itself for what
# that means for the file editing it.
#
# ## Why a separate workflow and not a job in `ci.yml`
#
# The `edited` trigger below is load-bearing - without it, adding the signature to the body never
# re-runs anything and the PR stays red forever, with no way out. But `types:` is set per-`on:`
# block, not per-job: putting this in `ci.yml` would mean every body edit, every typo fix in a PR
# description, re-runs the full matrix - a 90-minute `fmt · clippy · test` cold build included. So it
# lives alone, costs one ubuntu runner for a couple of seconds, and `ci.yml`'s triggers are untouched.
name: review signature

on:
  # No `branches:` filter, deliberately, for the reason `ci.yml` documents at length (#454): the
  # filter matches the PR's *base*, so a stacked PR onto a `pete/*` branch matches nothing, no run
  # is created, and the context reads `pending` rather than `skipped` - indistinguishable from
  # "still building" and permanently unsatisfiable. For a *gate* that failure mode is worse than
  # useless: it is the exact bypass this job exists to close. Build every PR whatever it targets.
  pull_request:
    # `opened`/`synchronize`/`reopened` are the defaults; `edited` is not, and is the one that
    # matters. The signature lives in the PR body, so the act of satisfying this check is a body
    # edit - which fires `edited` and nothing else. Omit it and the check is a trap with no exit.
    types: [opened, edited, synchronize, reopened]

  # There is deliberately no `push:` arm, and this is not an oversight.
  #
  # A push arm would have to pass trivially (a push has no PR body to read), and `main`/`sprint/**`
  # branches *are* PR heads - the sprint branch is merged to `main` by PR. A push to `sprint/foo`
  # with an open PR would fire both arms against the same head SHA: the real check and a trivially
  # green one, same context name. Branch protection honours whichever check-run reports last, so the
  # trivial pass could overwrite a genuine red. That is a bypass, so the arm is absent.
  #
  # Nothing is lost by omitting it: direct pushes to these branches are already refused, because
  # required status checks cannot be green on a commit that does not exist yet.

concurrency:
  # A burst of body edits while someone fixes a typo shouldn't queue five runs of the same check.
  group: review-signature-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  signature:
    name: reviewed-by signature
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Needed to read .github/reviewers.txt. Checks out the merge of base + PR head (the
      # `pull_request` event's default ref), so a PR that edits the roster is judged against its
      # own edited roster - the same trust boundary this file itself already sits inside, since a
      # PR can equally edit this workflow. persist-credentials is off; nothing here pushes.
      - name: check out the roster file
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/reviewers.txt
          sparse-checkout-cone-mode: false

      - name: the PR body carries a Reviewed-by line naming a roster reviewer
        env:
          # Via the environment, never interpolated into the script. `${{ ... }}` is substituted
          # into the shell source text before bash sees it, so a PR body containing a backtick or
          # `$(...)` would execute on the runner. A PR body is attacker-controlled by definition.
          PR_BODY: ${{ github.event.pull_request.body }}
          # Same rule, same reason. A login cannot contain shell metacharacters, but the habit is
          # the control - not the judgement about which values happen to be safe today.
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -uo pipefail

          # The name after `Reviewed-by:` at column 1, or empty if no such line exists. Everything
          # past a matched name is free text - what the reviewer actually checked.
          #
          # The `tr -d '\r'` is *not* load-bearing for the extraction and this comment used to claim
          # it was: GitHub stores bodies CRLF, but `\r` is `[[:space:]]`, so `Reviewed-by:\r` already
          # extracts empty and a real signature extracts with the `\r` still on the end, which the
          # roster match below tolerates. It stays because it keeps a stray `\r` out of the echoed
          # log line, and because the match would otherwise be quietly locale-dependent, not because
          # it is doing work today.
          signed_name() {  # signed_name <body> -> prints the text after the first Reviewed-by:, or nothing
            printf '%s' "$1" | tr -d '\r' \
              | grep -E '^Reviewed-by:[[:space:]]*[^[:space:]]' \
              | head -1 \
              | sed 's/^Reviewed-by:[[:space:]]*//'
          }

          # A signature is accepted only if the name matches an entry on the roster (nuthatch#619,
          # nuthatch#691) - a committed allowlist of the parties who may sign, `.github/reviewers.txt`.
          # Match is a prefix-with-boundary against each roster line, case-insensitive, so `Reviewed-
          # by: Iris (NIG-296)` matches roster entry `Iris` and `Reviewed-by: Irisbot` does not.
          #
          # Deliberately NOT a denylist of `pending`/`tbd`/`todo`/`pete-fathom`/`cargopete`. #619
          # rejects that shape for `pending` and is correct to - a denylist is a finite list against
          # an infinite set, and the next placeholder is `Reviewed-by: -`. Inverting it closes the
          # same hole completely: the accepted set is finite, `pending` is not in it, and the two
          # machine identities are never *refused* by name - they are simply absent, because the
          # roster is who can read a diff and neither denotes a party who can.
          roster_signed() {  # roster_signed <body> <roster, one name per line> -> 0 if the name is on the roster
            name="$(signed_name "$1")"
            [ -n "$name" ] || return 1
            while IFS= read -r entry; do
              [ -n "$entry" ] || continue
              if printf '%s' "$name" | grep -qiE "^${entry}([[:space:]]|\\(|\$)"; then
                return 0
              fi
            done < <(printf '%s\n' "$2")
            return 1
          }

          # Whether the signature names the PR's own author (nuthatch#691).
          #
          # Reviewers here sign as firm agents - `Iris`, `Rowan` - or as the shared human/git
          # identity `pete-fathom`, none of which are GitHub accounts, while this predicate compares
          # against `github.event.pull_request.user.login`, which is `cargopete` for every PR this
          # firm opens. Those name spaces do not intersect, so **for this firm this predicate cannot
          # fire** - it did not catch #688, which was self-signed `Reviewed-by: pete-fathom` and
          # went through, because `pete-fathom` is not `cargopete`. It is not "the one forgery this
          # mechanism can actually detect"; for this firm it detects approximately none. It stays
          # because it costs nothing, its self-tests are load-bearing, and it becomes live the day
          # separate GitHub identities per agent exist (nuthatch#691) - filed for the board, not
          # built here.
          self_signed() {  # self_signed <body> <author> -> 0 if the signature names the author
            [ -n "$2" ] || return 1
            printf '%s' "$(signed_name "$1")" | grep -qiE "^${2}([[:space:]]|\\(|$)"
          }

          # The matcher proves itself in BOTH directions before it is allowed to judge anything.
          # A gate asserted only in the passing direction is the mistake this repo has shipped five
          # times: every one of those tests was green with the mechanism removed. These cases are
          # the ones that died under mutation of the pattern above - drop the `^` anchor on the
          # extraction and the last three go green; drop the non-blank test and `colon only` goes
          # green; drop the roster boundary group and `prefix collision` goes green.
          #
          # A fixed test roster, not `.github/reviewers.txt` - this suite characterises the matcher,
          # and should not go red or green because someone edited the real roster.
          TEST_ROSTER="$(printf 'Iris\nRowan\nMabel\n')"
          selftest=0
          case_is() {  # case_is <want-exit> <label> <body>
            if roster_signed "$3" "$TEST_ROSTER"; then got=0; else got=1; fi
            if [ "$got" != "$1" ]; then
              echo "::error::roster matcher self-test failed: '$2' returned $got, wanted $1"
              selftest=1
            fi
          }
          case_is 0 'plain signature'       'Reviewed-by: Iris (NIG-235)'
          case_is 0 'signature after prose' "$(printf 'Fixes a thing.\n\nReviewed-by: Iris (NIG-235)')"
          case_is 0 'CRLF body'             "$(printf 'Fixes a thing.\r\nReviewed-by: Iris\r\n')"
          case_is 0 'trailing detail'       'Reviewed-by: Iris (CEO) - read against MountTable'
          case_is 1 'empty body'            ''
          case_is 1 'no signature at all'   "$(printf 'Fixes a thing.\n\nCloses #123.')"
          case_is 1 'colon, nothing after'  'Reviewed-by:'
          case_is 1 'colon, blanks after'   'Reviewed-by:   '
          case_is 1 'not at column 1'       '  Reviewed-by: Iris'
          case_is 1 'mid-line mention'      'I think Reviewed-by: Iris would be good'
          case_is 1 'prose mention only'    'This was reviewed by Iris, honest.'
          case_is 1 'placeholder text (#619)'       'Reviewed-by: pending'
          case_is 1 'machine identity, git name'     'Reviewed-by: pete-fathom'
          case_is 1 'machine identity, github login' 'Reviewed-by: cargopete'
          case_is 1 'name not on the roster'         'Reviewed-by: Jenny (board)'
          case_is 1 'prefix collision, no boundary'  'Reviewed-by: Irisbot'

          # The self-review predicate proves itself in both directions too, for the same reason: a
          # rule asserted only where it should fire is a rule that can stop firing unnoticed. These
          # are the cases that die under mutation - drop the `-i` and 'CargoPete' goes green; drop
          # the trailing `([[:space:]]|\(|$)` group and 'different login, same prefix' reds wrongly.
          self_is() {  # self_is <want-exit> <label> <body> <author>
            if self_signed "$3" "$4"; then got=0; else got=1; fi
            if [ "$got" != "$1" ]; then
              echo "::error::self-review self-test failed: '$2' returned $got, wanted $1"
              selftest=1
            fi
          }
          self_is 0 'author signs plainly'      'Reviewed-by: cargopete'                 'cargopete'
          self_is 0 'author signs with detail'  'Reviewed-by: cargopete (NIG-235)'       'cargopete'
          self_is 0 'author, different case'    'Reviewed-by: CargoPete'                 'cargopete'
          self_is 1 'someone else signs'        'Reviewed-by: Iris (NIG-235)'            'cargopete'
          self_is 1 'different login, prefix'   'Reviewed-by: cargopete-bot'             'cargopete'
          self_is 1 'author named in prose'     'Thanks cargopete. Reviewed-by: Iris'    'cargopete'
          self_is 1 'no signature at all'       'Fixes a thing.'                         'cargopete'
          self_is 1 'author unknown'            'Reviewed-by: cargopete'                 ''

          if [ "$selftest" != 0 ]; then
            echo "::error::The matcher is broken, so this run is judging nothing. Fix .github/workflows/review-signature.yml - do not merge past this by disabling the check."
            exit 1
          fi

          # Fail closed if the roster itself is gone - an empty ROSTER matches nothing below, which
          # already reds every PR, but say why rather than leaving that to be reverse-engineered.
          if [ ! -f .github/reviewers.txt ]; then
            echo "::error::.github/reviewers.txt is missing. Restore it - do not merge past this by disabling the check."
            exit 1
          fi
          ROSTER="$(grep -vE '^[[:space:]]*(#|$)' .github/reviewers.txt || true)"

          if roster_signed "$PR_BODY" "$ROSTER"; then
            if self_signed "$PR_BODY" "$PR_AUTHOR"; then
              printf '%s' "$PR_BODY" | tr -d '\r' | grep -E '^Reviewed-by:' | sed 's/^/  /'
              cat <<MSG
          ::error::The \`Reviewed-by:\` line names \`${PR_AUTHOR}\`, who opened this PR. A signature
          that names its own author asserts in writing that nobody else read the change.

          Get it reviewed by someone who is not you, and put their name on the line.
          MSG
              exit 1
            fi
            echo "Signed:"
            printf '%s' "$PR_BODY" | tr -d '\r' | grep -E '^Reviewed-by:' | sed 's/^/  /'
            echo
            echo "Note: this confirms the name is on the roster of parties who may sign"
            echo "(.github/reviewers.txt) and is not the PR author's own GitHub login. It cannot"
            echo "confirm the named reviewer read anything, and for this firm self_signed() above"
            echo "cannot catch a reviewer signing under an identity other than their login - see"
            echo "nuthatch#619 and nuthatch#691."
            exit 0
          fi

          # A required check that can red a branch needs a recovery path stated *in the failing
          # state* - not "see the docs", which is unreachable advice at the moment it is needed.
          cat <<'MSG'
          ::error::No `Reviewed-by:` line naming a roster reviewer in the PR body. This PR has not been signed off.

          To satisfy this check:

            1. Get the change reviewed by someone on the roster (.github/reviewers.txt) who is not
               its author.
            2. The reviewer adds a line to the PR *body* (not a comment - the audit and this
               check both read the body only), at the start of its own line:

                 Reviewed-by: <roster name> (<issue>)

               for example:  Reviewed-by: Iris (NIG-235)

            3. Saving the body fires the `edited` event, which re-runs this check automatically.
               There is nothing to re-trigger by hand and no need to push an empty commit.

          The name must match a line in .github/reviewers.txt (case-insensitive, exact word or a
          `name (detail)` form). Everything after it is free text - what was actually checked
          belongs there. `pending`, `tbd` and similar are not on the roster and will not pass, and
          neither will the login or git identity this firm's agents push under - see the roster
          file for why.
          MSG
          exit 1
