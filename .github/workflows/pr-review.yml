# Jules is an independent GitHub App reviewer, not an advisory Actions comment.
# The App owns `Jules approval`, which is green only for a `ship` verdict. A finding, malformed
# response, or failed review is red until a fix is pushed or a maintainer asks for `/re-review`.
#
# `pull_request_target` runs this trusted default-branch workflow with the App key, but PR code is
# never checked out or executed. The diff is fetched as data, so forks can be reviewed safely too.
name: Jules review

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: "pull request number to review"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: jules-review-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  review:
    name: Jules workflow
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request && contains(github.event.comment.body, '/re-review') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: which pull request
        id: pr
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
        run: |
          set -euo pipefail
          case "$PR_NUMBER" in ''|*[!0-9]*) echo "invalid PR number" >&2; exit 1;; esac
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: mint Jules App token
        id: jules
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.JULES_APP_ID }}
          private-key: ${{ secrets.JULES_PRIVATE_KEY }}
          permission-checks: write
          permission-pull-requests: write

      - name: fetch PR data and create Jules check
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          JULES_TOKEN: ${{ steps.jules.outputs.token }}
          PR: ${{ steps.pr.outputs.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh pr view "$PR" --repo "$REPO" --json headRefOid --jq '.headRefOid' > head.sha
          gh pr diff "$PR" --repo "$REPO" > pr.diff
          gh pr view "$PR" --repo "$REPO" --json title --jq '.title' > pr.title
          gh pr view "$PR" --repo "$REPO" --json body --jq '.body' > pr.body
          # The commit range, not just the diff (#1056). Reviewing the 3.1.0 release PR, Jules
          # reported at high severity that the wasmtime security fix "is not present in the diff"
          # and that RUSTSEC-2026-0268/0269 "remain present". Both false: the bump landed eleven
          # commits earlier and was already on the base. A release is a *range*, and no reviewer
          # reading only the diff could have got that right. Subjects only - cheap, and enough to
          # tell "absent from this diff" from "absent from the release".
          gh pr view "$PR" --repo "$REPO" --json commits \
            --jq '.commits[] | "\(.oid[0:9]) \(.messageHeadline)"' > pr.commits || : > pr.commits
          payload="$(jq -n --rawfile sha head.sha --arg id "pr-${PR}-${GITHUB_RUN_ID}" \
            '{name:"Jules approval",head_sha:($sha | rtrimstr("\n")),status:"in_progress",external_id:$id,output:{title:"Jules is reviewing",summary:"The App is reading this pull request."}}')"
          check_id="$(GH_TOKEN="$JULES_TOKEN" gh api --method POST "repos/$REPO/check-runs" --input - --jq '.id' <<<"$payload")"
          echo "id=$check_id" >> "$GITHUB_OUTPUT"

      # A cancelled run must not leave a verdict behind (#1056).
      #
      # `concurrency: cancel-in-progress` is right - reviewing a superseded commit is waste - but the
      # killed run left `Jules approval` sitting at **failure** from the review it interrupted. The PR
      # then reads red with no finding behind it, and during #1054 that state was reported as "still
      # red" repeatedly when nothing had failed: a review had been killed by the next push. A red
      # check must mean a finding.
      - name: a superseded review is neutral, not failed
        if: cancelled()
        env:
          JULES_TOKEN: ${{ steps.jules.outputs.token }}
          REPO: ${{ github.repository }}
          CHECK_ID: ${{ steps.check.outputs.id }}
        run: |
          set -uo pipefail
          [ -n "${CHECK_ID:-}" ] || exit 0
          payload="$(jq -n '{status:"completed",conclusion:"neutral",output:{
            title:"Superseded by a newer commit",
            summary:"This review was cancelled because the branch moved under it. It is not a verdict, and nothing was found. The run for the new head decides."}}')"
          GH_TOKEN="$JULES_TOKEN" gh api --method PATCH "repos/$REPO/check-runs/$CHECK_ID" --input - <<<"$payload" >/dev/null || true

      - name: review, report, and conclude
        env:
          GH_TOKEN: ${{ github.token }}
          JULES_TOKEN: ${{ steps.jules.outputs.token }}
          PR: ${{ steps.pr.outputs.number }}
          REPO: ${{ github.repository }}
          CHECK_ID: ${{ steps.check.outputs.id }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -uo pipefail
          conclusion=failure
          title="Jules could not complete the review"
          summary="The review failed closed. Fix the workflow or credentials, then comment /re-review."
          if python3 scripts/pr-review.py --diff pr.diff --title "$(cat pr.title)" \
              --body-file pr.body --commits-file pr.commits --json > review.json; then
            {
              echo '<!-- pr-review:luna -->'
              jq -r '"### Jules · merge-safety \(.confidence)/100\n\nverdict: **\(.verdict)**\n\n\(.summary)\n"' review.json
              jq -r 'if (.findings | length) == 0 then "No findings.\n" else "#### \(.findings | length) finding(s)\n\n" + ([.findings[] | "- \(.severity) · certainty \(.certainty // "?")/100 · \(.file):\(.line) - **\(.title)**\n  \(.detail)"] | join("\n")) + "\n" end' review.json
              echo '<sub>Jules · gpt-5.6-luna · required approval · push a fix or comment `/re-review` to run again</sub>'
            } > review.md
            if GH_TOKEN="$JULES_TOKEN" gh pr comment "$PR" --repo "$REPO" --body-file review.md; then
              verdict="$(jq -r '.verdict' review.json)"
              findings="$(jq '.findings | length' review.json)"
              if [ "$verdict" = ship ]; then
                conclusion=success
                title="Jules approves"
                summary="Jules returned ship with no blocking finding."
              else
                title="Jules requests follow-up"
                summary="Verdict: $verdict. Jules recorded $findings finding(s). Ask Claude to address them, push the fix, then comment /re-review if an immediate new pass is wanted."
              fi
            else
              summary="Jules produced a review but could not post it. Check the App Pull requests permission, then comment /re-review."
            fi
          else
            summary="Jules did not return a complete structured review. This is intentionally red rather than pretending the PR was approved. Comment /re-review after the failure is corrected."
          fi
          payload="$(jq -n --arg conclusion "$conclusion" --arg title "$title" --arg summary "$summary" \
            '{status:"completed",conclusion:$conclusion,output:{title:$title,summary:$summary}}')"
          GH_TOKEN="$JULES_TOKEN" gh api --method PATCH "repos/$REPO/check-runs/$CHECK_ID" --input - <<<"$payload"
          [ "$conclusion" = success ]
