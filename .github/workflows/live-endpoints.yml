# Are the RPC endpoints we *ship* still able to serve a backfill?
#
# Everything else in CI tests our code. This tests the world our code depends on, because the built-in
# endpoint lists in `src/chains.rs` are the zero-setup path - `init 0xAddr --chain mainnet && dev` uses
# them, and the founding non-negotiable is a live indexed query in under two minutes with no
# configuration. They are product surface that rots without anyone touching the repo.
#
# **This is not hypothetical.** On 2026-07-31 two of the four shipped mainnet defaults were dead:
# `ethereum-rpc.publicnode.com` had moved archive requests behind a token (so it could not serve a
# backfill at all, while being listed *first*), and `eth.llamarpc.com` was returning HTTP 521. The
# comment beside them read "Verified to serve keyless eth_getLogs (2026-07)" - stale within the month.
# Nothing in CI could have noticed, because nothing in CI talks to a real provider.
#
# Weekly, and on demand. Not on push: it is slow, it spends other people's quota, and a provider having
# a bad afternoon must never redden an unrelated PR.
name: live endpoints

on:
  schedule:
    # Monday morning. A week is short enough to catch a policy change before someone hits it, and long
    # enough that we are not hammering free tiers we do not pay for.
    - cron: "0 7 * * 1"
  workflow_dispatch:

jobs:
  probe:
    name: shipped defaults can still backfill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # #586: save the cache even when the job fails or is cancelled. rust-cache gates its save
          # on success() by default, so a job killed by an expired timeout seeds nothing and the next
          # run starts cold too - the deadlock half of #584, which raising ceilings does not fix.
          # Proven step-level on run 31824503060: rust-cache's post step was *skipped* while
          # checkout's succeeded in the same grace window.
          cache-on-failure: true
      - name: build doctor
        run: cargo build --release --bin nuthatch

      # The check that matters is **address-filtered getLogs a few thousand blocks behind tip** - the
      # smallest request a real backfill makes. A tip-only probe passes on endpoints that cannot
      # backfill, which is precisely how the July regression went unnoticed.
      - name: probe every shipped default
        run: |
          set -uo pipefail
          fail=0
          MAX_ATTEMPTS=3

          # #633: eth.drpc.org and arbitrum.drpc.org both failed a scheduled run and answered fine two
          # days later - one bad minute at a provider read exactly like a shipped default that had
          # genuinely died, because the gate below judged a single attempt. Retry absorbs the blip;
          # the gate still has to fire for the case the blip was hiding.
          #
          # Runs <cmd>, tee'd to <out-file> same as before retries existed, up to MAX_ATTEMPTS times,
          # stopping at the first attempt whose output matches <success-pattern>. Leaves RETRY_OK (1
          # iff a match was found) and RETRY_ATTEMPTS (how many attempts that took, capped at
          # MAX_ATTEMPTS) for the caller - the caller's own gate decides what a full-attempts failure
          # means, this just supplies the pattern.
          retry() {  # retry <success-pattern> <label> <out-file> <cmd...>
            local success_pattern="$1" label="$2" outfile="$3"
            shift 3
            RETRY_OK=0
            for RETRY_ATTEMPTS in $(seq 1 "$MAX_ATTEMPTS"); do
              "$@" 2>&1 | tee "$outfile"
              if grep -q "$success_pattern" "$outfile"; then
                RETRY_OK=1
                return 0
              fi
              if [ "$RETRY_ATTEMPTS" -lt "$MAX_ATTEMPTS" ]; then
                backoff=$((RETRY_ATTEMPTS * 15))
                echo "  [$label] attempt $RETRY_ATTEMPTS/$MAX_ATTEMPTS did not succeed, retrying in ${backoff}s"
                sleep "$backoff"
              fi
            done
          }
          probe() {  # probe <chain> <busy-contract> <url>
            echo "== $1 =="
            retry "getLogs window   up to" "$3" /tmp/out \
              ./target/release/nuthatch doctor --dir . --rpc "$3" --address "$2"
            # `doctor` reports rather than judges, so the gate is here: an endpoint that cannot serve a
            # windowed getLogs cannot serve a backfill, whatever else it does well.
            #
            # Allowlist, not denylist: a doctor run that never got this far - crashed, timed out,
            # printed nothing - produces no "getLogs window" line at all, which a `grep FAILED` check
            # cannot distinguish from a healthy one. Assert the line is present, then require the
            # healthy string exactly.
            #
            # Only MAX_ATTEMPTS/MAX_ATTEMPTS - every retry exhausted - reds the job. Fewer failed
            # attempts than that get a line in the log, same as a healthy run, because that is what
            # they are: a provider having a moment, not a dead default.
            if [ "$RETRY_OK" -eq 1 ]; then
              if [ "$RETRY_ATTEMPTS" -gt 1 ]; then
                echo "::warning::$3 needed $RETRY_ATTEMPTS/$MAX_ATTEMPTS attempts to serve a getLogs window - a provider having a moment, not counted as dead"
              fi
            elif ! grep -q "getLogs window" /tmp/out; then
              echo "::error::$3 produced no getLogs-window line in $RETRY_ATTEMPTS/$MAX_ATTEMPTS attempts - the probe did not run, so this gate judged nothing"
              fail=1
            else
              echo "::error::$3 cannot serve getLogs in $RETRY_ATTEMPTS/$MAX_ATTEMPTS attempts - it cannot back a zero-setup nest"
              fail=1
            fi
          }
          # Contracts chosen for being busy on each chain, so a window that works here works generally.
          for u in https://eth-pokt.nodies.app https://eth.drpc.org https://eth.api.onfinality.io/public; do
            probe mainnet 0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48 "$u"
          done
          for u in https://arb1.arbitrum.io/rpc https://arbitrum.drpc.org https://arb-pokt.nodies.app; do
            probe arbitrum-one 0xaf88d065e77c8cC2239327C5EDb3A432268e5831 "$u"
          done
          for u in https://mainnet.base.org https://base.drpc.org https://base-pokt.nodies.app; do
            probe base 0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913 "$u"
          done
          # Polygon: probe each shipped endpoint for getLogs failure (same gate as above).
          # Additionally confirm the archive endpoint is still archive: a non-archive URL listed first
          # silently breaks backfill even when its getLogs window is wide. That is what broke on
          # 2026-08-20 - polygon-bor-rpc.publicnode.com (non-archive) was first.
          for u in https://polygon.drpc.org https://polygon-bor-rpc.publicnode.com; do
            probe polygon 0x0d500B1d8E8eF31E21C99d1Db9A6444d3ADf1270 "$u"
          done
          # Archive-depth gate for the first (archive) endpoint. Allowlist, not denylist, for the same
          # reason as the getLogs gate above: a doctor run that never printed an "archive depth" line -
          # because it never ran, errored, or the endpoint refused and doctor reported UNKNOWN - must
          # not read as healthy just because it also isn't the exact string "no". Require the line
          # present, then require it read "yes" exactly. Same retry budget as the getLogs probes above,
          # for the same reason: this is the same live-provider dependency, just a different question.
          echo "== polygon archive check =="
          retry "archive depth    yes" "https://polygon.drpc.org (archive)" /tmp/polygon-archive-out \
            ./target/release/nuthatch doctor --rpc https://polygon.drpc.org \
            --address 0x0d500B1d8E8eF31E21C99d1Db9A6444d3ADf1270
          if [ "$RETRY_OK" -eq 1 ]; then
            if [ "$RETRY_ATTEMPTS" -gt 1 ]; then
              echo "::warning::polygon.drpc.org needed $RETRY_ATTEMPTS/$MAX_ATTEMPTS attempts to confirm archive depth - a provider having a moment, not counted as dead"
            fi
          elif ! grep -q "archive depth" /tmp/polygon-archive-out; then
            echo "::error::doctor produced no archive-depth line for polygon.drpc.org in $RETRY_ATTEMPTS/$MAX_ATTEMPTS attempts - the probe did not run, so this gate judged nothing"
            fail=1
          else
            echo "::error::polygon.drpc.org is not archive (or refused to say) in $RETRY_ATTEMPTS/$MAX_ATTEMPTS attempts - it cannot be the primary endpoint for polygon"
            fail=1
          fi
          # Deliberately fails the job rather than warning. A dead default is a broken promise for
          # every new user of that chain, and a warning nobody reads is how this one survived a month.
          exit $fail

      # **`init` itself, against a real contract, with no key** (#1138). Sourcify changed which v2
      # field selectors it accepts, the code's request got HTTP 400 on every chain for an unknown
      # stretch, and keyless `init` survived only where a Blockscout instance happened to be wired.
      # No unit test asks the live service what it accepts, and the endpoint probes above never touch
      # the ABI path. So run the one command the README leads with and require the line that says
      # *which* source answered - a fallback quietly answering instead is the failure this exists to
      # see. `if: always()` because this judges a different promise from the getLogs gate above and
      # must not be skipped by it.
      - name: keyless init resolves an ABI through Sourcify
        if: always()
        run: |
          set -u
          if out=$(./target/release/nuthatch init 0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48 --chain mainnet --dir "$(mktemp -d)" 2>&1); then
            echo "$out" | tail -20
          else
            echo "$out" | tail -40
            echo "::error::keyless init of mainnet USDC failed - the README's first command does not work"
            exit 1
          fi
          if ! echo "$out" | grep -q "ABI resolved via Sourcify"; then
            echo "::error::init resolved the ABI somewhere other than Sourcify - the v2 request shape or the service changed (#1138); the Etherscan-keyed chains are dark again"
            exit 1
          fi

  # **A failed scheduled run is invisible, so it files an issue** (#1130). A `schedule:` run
  # attaches its check to no pull request, and a red nightly is not what the branch badge reflects,
  # so `required contexts match protection` sat red for six consecutive days unnoticed.
  #
  # Only `github.event_name == 'schedule'`: a failing `pull_request` or `push` run already surfaces
  # itself on the PR or the commit, and filing an issue for those would be noise. Guarded by
  # `tests/scheduled_workflow_failure_is_reported.rs`, which checks this condition rather than only
  # the job's presence - a reporter that can never fire would otherwise pass a presence check.
  report-scheduled-failure:
    name: surface a failed scheduled run
    needs: [probe]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      # The reporter is a local composite action, so the tree has to be present to load it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/report-scheduled-failure
