# Name the instruction behind a fault offset in a shipped release (#1165).
#
# Release binaries are stripped, so a kernel line like
#   segfault at … ip 00005cd9e3f7fef0 … in nuthatch-3.4.0[…,5cd9e0ee8000+4a70000]
# gives an offset (ip - load base) and nothing else. This rebuilds the same ref with the same
# profile on the same runner image, keeping symbols and line tables (neither changes code layout),
# checks that `.text` has the same address and size as the shipped binary would, and prints the
# function and source line at each offset into the job log. Manual only; nothing is published.
name: symbolise
on:
  # A push to this branch runs it too: `workflow_dispatch` only resolves workflows that exist on
  # the default branch, and this one is wanted before it has been through review.
  push:
    branches: [pete/1165-symbols]
  workflow_dispatch:
    inputs:
      ref:
        description: the tag or commit the shipped binary was built from
        required: true
        default: v3.4.0
      offsets:
        description: space-separated hex offsets into the binary (ip minus load base)
        required: true
        default: "0x3097ef0"
permissions:
  contents: read
jobs:
  symbolise:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || 'v3.4.0' }}
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-x86_64-unknown-linux-gnu
      - name: build with symbols kept
        env:
          # symbols only: line tables changed codegen (run 33977378161 had .text at 0x17d2080, 1.4 MB
          # larger than the shipped 0x15d7f00 / 0x4a6d290, and named a scaffolding function)
          CARGO_PROFILE_RELEASE_STRIP: "false"
        run: cargo build --release --locked --target x86_64-unknown-linux-gnu
      - name: symbolise
        env:
          # the shipped ip, and the same .text-relative offset in this build (.text starts 0xdc0 earlier here)
          OFFSETS: ${{ inputs.offsets || '0x3097ef0 0x3097130' }}
        run: |
          set -euo pipefail
          B=target/x86_64-unknown-linux-gnu/release/nuthatch
          echo "== sections (compare .text to the shipped binary's: addr 15d7f00 size 4a6d290 for v3.4.0)"
          readelf -SW "$B" | awk '$2 ~ /^\.(text|rodata|eh_frame)$/ {print $2, $4, $6}'
          for off in $OFFSETS; do
            echo "== $off"
            addr2line -f -C -e "$B" "$off" || true
            echo "-- nearest symbol below (nm):"
            nm -C --defined-only "$B" | awk -v o="$off" 'BEGIN{t=strtonum(o)} $2 ~ /^[tTwW]$/ {a=strtonum("0x"$1); if (a<=t && a>best) {best=a; sym=$0}} END{printf "%s  (+0x%x)\n", sym, t-best}'
            echo "-- every function within 8 KB either side (layout differs from the shipped binary by a few KB):"
            nm -C --defined-only "$B" | awk -v o="$off" 'BEGIN{t=strtonum(o)} $2 ~ /^[tTwW]$/ {a=strtonum("0x"$1); if (a>=t-8192 && a<=t+8192) print $0}' | sort | cut -c1-160
            echo "-- disassembly around it:"
            objdump -d -C --start-address=$(printf '0x%x' $(( off - 64 ))) --stop-address=$(printf '0x%x' $(( off + 48 ))) "$B" | tail -40 || true
          done
