name: tmp-macos-verify-650

# Throwaway: one-off macOS verification for #650 (NIG-270). Not meant to stay - remove once the
# e2e_fe_admin_exposure fix is confirmed green on a real macos-14 runner.
on:
  push:
    branches: [pete/650-macos-loopback-bind]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: lo0 state before the fix runs (context for the failure this replaces)
        run: ifconfig lo0
      - name: cargo test e2e_fe_admin_exposure
        run: cargo test --test e2e_fe_admin_exposure -- --nocapture
