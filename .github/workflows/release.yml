name: release

# On a version tag, build native binaries per target and attach them to the GitHub Release.
# Built on the pinned toolchain (rust-toolchain.toml → 1.95.0), so the dbsp/next-solver ICE that
# breaks `cargo install` on rustc 1.97 never applies - users download a binary and never compile.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Creates (or updates) the release with its body, before the matrix starts. Must be a separate
  # job, not a step tacked onto `build`: the first `attach to release` step in that job carries no
  # `if:`, so it runs once per matrix leg, concurrently - give *that* step a body_path and every leg
  # races to set it. Doing it here instead means the matrix's two action-gh-release calls only ever
  # pass `files:`, and softprops/action-gh-release preserves the existing body on an update when the
  # call doesn't set body/body_path (`body = workflowBody || existingReleaseBody`, src/github.ts) -
  # so attaching files afterward can't blank out what this job wrote.
  release-notes:
    name: release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: resolve release notes
        id: notes
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [ ! -f "$notes" ]; then
            echo "::error::$notes not found. Every tagged release needs its notes written at that path before tagging - see docs/releases/README.md."
            exit 1
          fi
          echo "path=$notes" >> "$GITHUB_OUTPUT"
      # Created as a **draft** (#626). This job runs before a single binary has been built, so a
      # published release here means a failing matrix leaves a live, fully-annotated release with no
      # assets attached, visible to anyone watching the repo and to `gh release download`. A draft is
      # visible only to people with write access, so the failure stays private until it is fixed.
      # The `publish` job at the bottom flips it once everything has actually built.
      #
      # The draft flag is repeated on every action-gh-release call in this workflow rather than set
      # once here, because the attach steps below issue *updates* against this release and the
      # action's handling of an unset draft input on update is not something to bet a public release
      # on. Stating it each time costs a line and removes the question.
      # A tag carrying a semver pre-release identifier (the `-` in `v3.0.0-alpha.1`) is marked as a
      # prerelease. `prerelease` defaults to **false** in action-gh-release's own action.yml, so
      # without this an alpha publishes as a full release and takes the repo's "Latest release"
      # badge - the first thing anyone landing on the repo is offered. Repeated on every call for
      # the same reason `draft` is: the attach steps below issue *updates*, and an unset input on
      # update is not a thing to bet a public release on.
      - name: create draft release with notes
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: ${{ steps.notes.outputs.path }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  build:
    name: ${{ matrix.target }}
    needs: release-notes
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14        # Apple Silicon
            target: aarch64-apple-darwin
          # Pinned to 22.04 (glibc 2.35), NOT `ubuntu-latest`. A dynamically-linked binary requires the
          # glibc it was built against *or newer*, so the builder's glibc is the floor for every system
          # that can run the release. On `ubuntu-latest` (24.04, glibc 2.39) that floor silently rose to
          # 2.39, excluding Debian 12, Ubuntu 22.04, RHEL 9 and Amazon Linux 2023 - and it went unnoticed
          # because every box we test on is modern Ubuntu.
          #
          # It surfaced when the container job's smoke test ran the binary against `debian:bookworm-slim`
          # (glibc 2.36) and got `version 'GLIBC_2.39' not found`. **The image base must stay >= this
          # runner's glibc**; bookworm's 2.36 covers 22.04's 2.35 with room to spare.
          - os: ubuntu-22.04    # x86_64 Linux (glibc 2.35 - the portability floor)
            target: x86_64-unknown-linux-gnu
          # x86_64-apple-darwin (Intel Mac) is intentionally omitted: macos-13 runners are scarce
          # and Intel Macs are a shrinking minority; those users build from source (cargo install)
          # or run under a future addition. The installer routes them to the build-from-source path.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # #586: save the cache even when the job fails or is cancelled. rust-cache gates its save
          # on success() by default, so a job killed by an expired timeout seeds nothing and the next
          # run starts cold too - the deadlock half of #584, which raising ceilings does not fix.
          # Proven step-level on run 31824503060: rust-cache's post step was *skipped* while
          # checkout's succeeded in the same grace window.
          cache-on-failure: true
          key: release-${{ matrix.target }}
      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: package
        run: |
          tarball="nuthatch-${{ matrix.target }}.tar.gz"
          tar czf "$tarball" -C "target/${{ matrix.target }}/release" nuthatch
          shasum -a 256 "$tarball" > "$tarball.sha256"
          ls -lh "$tarball"
      - name: attach to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            nuthatch-${{ matrix.target }}.tar.gz
            nuthatch-${{ matrix.target }}.tar.gz.sha256
          fail_on_unmatched_files: true
      # The **scaled-mode** binary: the same source with `--features postgres-store`, which is what a
      # fleet operator needs (`nuthatch worker`, `nuthatch control`, `serve --hot-store`). Built and
      # shipped separately rather than folded into the default one, because non-negotiable 1 says the
      # primary artifact runs with zero external services - and a binary carrying a Postgres driver is
      # a different promise even if it behaves identically when you do not use it.
      #
      # Without this, scaled mode was build-from-source only, which is not a deployment story.
      - name: build (scaled)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo build --release --locked --features postgres-store --target ${{ matrix.target }}
      - name: package (scaled)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          tarball="nuthatch-scaled-${{ matrix.target }}.tar.gz"
          tar czf "$tarball" -C "target/${{ matrix.target }}/release" nuthatch
          shasum -a 256 "$tarball" > "$tarball.sha256"
          ls -lh "$tarball"
      - name: attach scaled build to release
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            nuthatch-scaled-${{ matrix.target }}.tar.gz
            nuthatch-scaled-${{ matrix.target }}.tar.gz.sha256
          fail_on_unmatched_files: true
      - name: keep the scaled binary for the image
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nuthatch-scaled-binary
          path: target/${{ matrix.target }}/release/nuthatch
          retention-days: 1
      # Hand the *default* Linux binary to the container job so the image ships the same artifact that
      # is attached to the release, rather than a second build nobody diffed. Note this step runs after
      # the scaled build overwrote the binary, so it re-runs the default build first.
      - name: rebuild the default binary for the image
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: keep the linux binary for the image
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nuthatch-linux-binary
          path: target/${{ matrix.target }}/release/nuthatch
          retention-days: 1

  # Publish the container image (RFC-0005 release engineering). "Build it yourself from this Dockerfile"
  # is not a deployment story for a platform team, which is what this closes.
  container:
    name: container image
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nuthatch-linux-binary
      - name: log in to ghcr
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: version
        id: v
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      # Build locally, prove it runs, and only then publish - in that order. It used to push first and
      # smoke-test the pushed tag, which meant a failing test failed the *job* but left the broken image
      # public: v0.7.0 published a `:0.7.0` and a `:latest` that died with `GLIBC_2.38 not found`, and a
      # red tick in Actions does not un-pull an image someone already has.
      #
      # x86_64 only, matching the single Linux target the release builds. A multi-arch image would need
      # an aarch64-linux binary we do not currently produce - stated rather than implied.
      - name: build the image
        run: docker build --platform linux/amd64 -t nuthatch:candidate .
      - name: smoke-test before publishing
        run: docker run --rm nuthatch:candidate --version
      - name: push the tested image
        run: |
          # `docker tag` of the smoke-tested image, not a rebuild: what ships is the exact thing that
          # passed above, same digest.
          for tag in "${{ steps.v.outputs.tag }}" latest; do
            docker tag nuthatch:candidate "ghcr.io/${{ github.repository }}:$tag"
            docker push "ghcr.io/${{ github.repository }}:$tag"
          done
      # The scaled-mode image, tagged `-scaled`. Same Dockerfile, different binary. **Not** tagged
      # `latest`: the default image stays the one you get by not thinking about it, because embedded
      # mode is the primary deliverable and the scaled one carries a database driver.
      - name: fetch the scaled binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nuthatch-scaled-binary
          path: scaled
      - name: build, test and push the scaled image
        run: |
          cp scaled/nuthatch ./nuthatch
          docker build --platform linux/amd64 -t nuthatch:scaled .
          # Same ordering discipline as above - prove it runs before publishing it. The extra check
          # here is that the scaled subcommands actually exist, which is the entire point of the image:
          # a `-scaled` tag whose binary lacks `worker` would be worse than no tag.
          docker run --rm nuthatch:scaled --version
          docker run --rm nuthatch:scaled worker --help > /dev/null
          docker run --rm nuthatch:scaled control --help > /dev/null
          docker tag nuthatch:scaled "ghcr.io/${{ github.repository }}:${{ steps.v.outputs.tag }}-scaled"
          docker push "ghcr.io/${{ github.repository }}:${{ steps.v.outputs.tag }}-scaled"

  # The release goes public here and nowhere else (#626). Everything above builds against a draft:
  # two binary targets, the scaled binary, and two container images that are smoke-tested before they
  # are pushed. Only when all of that has succeeded does the release stop being a draft.
  #
  # `needs: container` rather than `needs: build`, and that is a deliberate choice rather than an
  # oversight: an image is part of what a release promises (RFC-0005), so a green matrix with a failed
  # container job is an incomplete release and a human should decide what to do about it. Which they
  # can, cheaply - the draft is sitting there with its notes and its binaries already attached, and
  # the recovery is one command, stated here because a failure message that names an unreachable
  # recovery path is worse than none:
  #
  #     gh release edit v<x.y.z> --draft=false
  #
  # There is no `if: always()`. A failure upstream must leave this job unrun, because "publish it
  # anyway" is the exact behaviour the issue was filed about.
  publish:
    name: publish the release
    needs: container
    runs-on: ubuntu-latest
    steps:
      - name: undraft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "$GITHUB_REF_NAME" --draft=false \
            --prerelease=${{ contains(github.ref_name, '-') }} --repo "$GITHUB_REPOSITORY"
          echo "published $GITHUB_REF_NAME"
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,assets \
            --jq '"draft=\(.isDraft) prerelease=\(.isPrerelease) assets=\(.assets | length)"'
