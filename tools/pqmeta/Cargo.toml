[package]
name = "pqmeta"
version = "0.1.0"
edition = "2021"
[dependencies]
parquet = { version = "58", default-features = false, features = ["arrow", "snap"] }

# Deliberately a standalone crate, not a workspace member: it exists to inspect what nuthatch WROTE,
# and building it against nuthatch's own dependency graph would let a shared version pin hide a
# difference. Run with `cargo run --release -- <file.parquet>` from this directory.
