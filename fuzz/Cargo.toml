[package]
name = "nuthatch-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
alloy-json-abi = "1.6"
alloy-primitives = "1.6"
serde_json = "1"
hex = "0.4"

[dependencies.nuthatch-decode]
path = "../nuthatch-decode"

# Decode must stay a deterministic, panic-free boundary against attacker-supplied ABIs and logs
# (CLAUDE.md §4, nuthatch#290). `debug-assertions` and ASan are both safe here because
# `nuthatch-decode` does not depend on `dbsp`, so the rustc ICE (vtable slot for
# `StarJoinFuncTrait`/`DynClone` under SanitizerCoverage) cannot occur.
[profile.release]
overflow-checks = true
debug-assertions = true
lto = false

[[bin]]
name = "abi_json"
path = "fuzz_targets/abi_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "abi_arbitrary"
path = "fuzz_targets/abi_arbitrary.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_log"
path = "fuzz_targets/decode_log.rs"
test = false
doc = false
bench = false
