[package]
name = "nuthatch-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
alloy-json-abi = "1.6"
alloy-primitives = "1.6"
serde_json = "1"
hex = "0.4"

[dependencies.nuthatch-decode]
path = "../decode"

# Decode must stay a deterministic, panic-free boundary against attacker-supplied ABIs and logs
# (CLAUDE.md §4, nuthatch#290) - overflow checks on so an integer-overflow panic in a size
# computation (e.g. a `uint256[huge]` array type) counts as a crash, not silent wraparound.
#
# debug-assertions and ASan are safe to run alongside this as of nuthatch#581: the crate depends on
# `nuthatch-decode`, which does not link dbsp, so the trait-solver ICE that used to force
# `-O --sanitizer none` (dbsp's `StarJoinFuncTrait`/`DynClone` vtable slot, a rustc bug) cannot be
# reached from this build. See fuzz/README.md for the full history.
[profile.release]
overflow-checks = true
lto = false

[[bin]]
name = "abi_json"
path = "fuzz_targets/abi_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "abi_arbitrary"
path = "fuzz_targets/abi_arbitrary.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_log"
path = "fuzz_targets/decode_log.rs"
test = false
doc = false
bench = false
