[package]
name = "nuthatch-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
alloy-json-abi = "1.6"
alloy-primitives = "1.6"
serde_json = "1"
hex = "0.4"

[dependencies.nuthatch]
path = ".."

# Decode must stay a deterministic, panic-free boundary against attacker-supplied ABIs and logs
# (CLAUDE.md §4, nuthatch#290) - overflow checks on so an integer-overflow panic in a size
# computation (e.g. a `uint256[huge]` array type) counts as a crash, not silent wraparound.
#
# Deliberately NOT `debug-assertions = true` alongside this: that combination (or ASan) makes
# nightly's trait solver ICE compiling dbsp (ties into a `dyn StarJoinFuncTrait`/`DynClone` vtable
# slot - a rustc bug, not ours). `overflow-checks` alone reproducibly does not trigger it. Build
# with `cargo fuzz build -O --sanitizer none` - see fuzz/README.md and the `fuzz-smoke` CI job for
# the full story and how to re-check whether upstream has fixed it.
[profile.release]
overflow-checks = true

[[bin]]
name = "abi_json"
path = "fuzz_targets/abi_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "abi_arbitrary"
path = "fuzz_targets/abi_arbitrary.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_log"
path = "fuzz_targets/decode_log.rs"
test = false
doc = false
bench = false
