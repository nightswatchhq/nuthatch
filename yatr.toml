# yatr - https://github.com/cargopete/yatr
#
# Task names are the same across every nightswatchhq repo, so `yatr ci` means
# the same thing wherever you are. Note that `ci` is deliberately not called
# `check`: `yatr check` is a builtin that validates this file, and it shadows
# any task of that name without warning.

# `yatr ci` runs what the required `fmt · clippy · test` check runs (the default and exex legs in
# .github/workflows/ci.yml: fmt, clippy and test for the root crate and for decode/, and the exex
# leg), the non-required counter and graph legs, and cargo-deny.
#
# It leaves these to CI, because they need Docker, a Postgres or S3 server, a Linux runner, a long
# soak or the nightly toolchain, and a local `yatr ci` would either skip them or lie about them:
#   pg-parity, crash-points, minio-publish, trino-contract, fleet (compose), footprint and RAM
#   budget, point-read latency, build release, fuzz smoke (`yatr fuzz-smoke` runs it by hand).
# `scripts/verify.sh` is a runbook for a running nest or fleet, not part of this gate.

[env]
RUST_BACKTRACE = "1"

[settings]
cache = true
watch_debounce_ms = 200

[tasks.fmt]
desc = "Format the tree"
run = ["cargo fmt --all"]
no_cache = true

[tasks.fmt-check]
desc = "Fail if the tree is unformatted"
run = ["cargo fmt --all -- --check"]
sources = ["src/**/*.rs", "decode/**/*.rs", "tests/**/*.rs"]

[tasks.lint]
desc = "Clippy with warnings denied"
run = ["cargo clippy --all-targets -- -D warnings"]
sources = ["src/**/*.rs", "decode/**/*.rs", "Cargo.toml", "Cargo.lock"]

[tasks.test]
desc = "Run the test suite (needs cargo-nextest, as CI does)"
run = ["cargo nextest run --locked", "cargo test --doc --locked"]
sources = ["src/**/*.rs", "decode/**/*.rs", "tests/**/*.rs", "Cargo.toml", "Cargo.lock"]
watch = ["src/**/*.rs", "tests/**/*.rs"]

[tasks.components]
desc = "fmt, clippy and unit tests for the standalone guest components (host target)"
run = [
  "cargo fmt --check --manifest-path components/large-transfers/Cargo.toml",
  "cargo fmt --check --manifest-path components/recurrence/Cargo.toml",
  "cargo fmt --check --manifest-path components/screen/Cargo.toml",
  "cargo clippy --locked --all-targets --manifest-path components/large-transfers/Cargo.toml -- -D warnings",
  "cargo clippy --locked --all-targets --manifest-path components/recurrence/Cargo.toml -- -D warnings",
  "cargo clippy --locked --all-targets --manifest-path components/screen/Cargo.toml -- -D warnings",
  "cargo test --locked --manifest-path components/large-transfers/Cargo.toml",
  "cargo test --locked --manifest-path components/recurrence/Cargo.toml",
  "cargo test --locked --manifest-path components/screen/Cargo.toml",
]
sources = ["components/*/src/**/*.rs", "components/*/Cargo.toml", "components/*/Cargo.lock", "wit/**"]

[tasks.decode]
desc = "fmt, clippy and test for the decode crate (its own workspace, so the root cargo never runs its tests)"
run = [
  "cargo fmt --check --manifest-path decode/Cargo.toml",
  "cargo clippy --all-targets --manifest-path decode/Cargo.toml -- -D warnings",
  "cargo test --locked --manifest-path decode/Cargo.toml",
]
sources = ["decode/**/*.rs", "decode/Cargo.toml", "decode/Cargo.lock"]

[tasks.exex]
desc = "clippy and test with --features exex"
run = [
  "cargo clippy --features exex --all-targets -- -D warnings",
  "cargo nextest run --features exex --locked",
  "cargo test --doc --features exex --locked",
]
sources = ["src/**/*.rs", "decode/**/*.rs", "tests/**/*.rs", "Cargo.toml", "Cargo.lock"]

[tasks.counter]
desc = "clippy and test with --features counter"
run = [
  "cargo clippy --features counter --all-targets -- -D warnings",
  "cargo nextest run --features counter --locked",
  "cargo test --doc --features counter --locked",
]
sources = ["src/**/*.rs", "decode/**/*.rs", "tests/**/*.rs", "Cargo.toml", "Cargo.lock"]

[tasks.graph]
desc = "clippy (graph, folds alone) and test with --features graph"
run = [
  "cargo clippy --features graph --all-targets -- -D warnings",
  "cargo clippy --features folds --all-targets -- -D warnings",
  "cargo nextest run --locked --features graph",
  "cargo test --doc --locked --features graph",
]
sources = ["src/**/*.rs", "decode/**/*.rs", "tests/**/*.rs", "Cargo.toml", "Cargo.lock"]

[tasks.deny]
desc = "cargo-deny: licences, bans, advisories, sources"
run = ["cargo deny check"]
sources = ["deny.toml", "Cargo.lock"]

[tasks.build]
desc = "Build the release binary"
run = ["cargo build --release"]
sources = ["src/**/*.rs", "decode/**/*.rs", "Cargo.toml", "Cargo.lock"]
outputs = ["target/release/nuthatch"]

[tasks.doc]
desc = "Build the API docs"
run = ["cargo doc --no-deps"]
sources = ["src/**/*.rs", "decode/**/*.rs"]

[tasks.fuzz-smoke]
desc = "Short fuzz run over each target (needs a nightly toolchain)"
run = ["cargo +nightly fuzz run abi_arbitrary -- -max_total_time=60"]
cwd = "fuzz"
no_cache = true
allow_failure = true

[tasks.ci]
desc = "What CI runs: fmt-check, lint, test, components, decode, exex, counter, graph, deny"
depends = ["fmt-check", "lint", "test", "components", "decode", "exex", "counter", "graph", "deny"]
run = []
